<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FONG 煙火精選目錄</title>

  <meta property="og:title" content="FONG 煙火精選商品目錄">
  <meta property="og:description" content="提供最新煙火款式、價格及現場施放影片展示，歡迎選購！">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://fong-shop.github.io/Fong/">
  <meta property="og:image" content="https://fong-shop.github.io/Fong/messageImage_1785794548467.jpg">

  <style>
    * { box-sizing: border-box; }
    body {
      font-family: Arial, sans-serif;
      background-color: #f4f4f4;
      margin: 0;
      padding: 20px 20px 80px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* 📢 公告區樣式 */
    .announcement {
      width: 100%;
      max-width: 1000px;
      background-color: #fff3cd; 
      color: #856404;
      padding: 12px 20px;
      border-radius: 8px;
      margin-bottom: 20px;
      border-left: 5px solid #ffc107;
      font-size: 0.95rem;
      line-height: 1.5;
      box-shadow: 0 2px 5px rgba(0,0,0,0.05);
    }

    /* 分類導覽列樣式 */
    .category-nav {
      display: flex;
      gap: 12px;
      margin-bottom: 25px;
      overflow-x: auto;
      padding-bottom: 5px;
      max-width: 1000px;
      width: 100%;
      /* 隱藏捲軸但可滑動 */
      scrollbar-width: none; 
    }
    .category-nav::-webkit-scrollbar {
      display: none; 
    }

    .cat-btn {
      padding: 10px 20px;
      background-color: #333;
      color: #fff;
      border: 1px solid #555;
      border-radius: 25px;
      cursor: pointer;
      font-size: 1rem;
      white-space: nowrap;
      transition: all 0.2s;
    }

    .cat-btn:hover {
      background-color: #444;
    }

    .cat-btn.active {
      background-color: #ff4d4d;
      border-color: #ff4d4d;
      font-weight: bold;
    }

    /* 商品列表容器 */
    .container {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 20px;
      max-width: 1000px;
      width: 100%;
    }

    .product-card {
      background-color: #000;
      color: #fff;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.15);
      border: 2px solid #000;
      display: flex;
      flex-direction: column;
    }

    .media-container {
      position: relative;
      width: 100%;
      height: 220px;
      cursor: pointer;
      background-color: #222;
    }

    .media-container img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      position: absolute;
      top: 0;
      left: 0;
      z-index: 10;
      transition: opacity 0.3s;
    }

    .play-button {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 50px;
      height: 50px;
      background-color: rgba(0, 0, 0, 0.7);
      border-radius: 50%;
      border: 2px solid #fff;
      z-index: 20;
      display: flex;
      justify-content: center;
      align-items: center;
      transition: all 0.2s;
    }

    .play-button::after {
      content: '';
      display: block;
      width: 0;
      height: 0;
      border-style: solid;
      border-width: 10px 0 10px 18px;
      border-color: transparent transparent transparent #fff;
      margin-left: 4px;
    }

    .media-container:hover .play-button {
      transform: translate(-50%, -50%) scale(1.1);
      background-color: rgba(255, 0, 0, 0.85);
    }

    .media-container iframe {
      width: 100%;
      height: 100%;
      border: none;
      position: absolute;
      top: 0;
      left: 0;
      z-index: 5;
    }

    .media-container.playing img,
    .media-container.playing .play-button {
      opacity: 0;
      pointer-events: none;
    }

    .card-info {
      padding: 15px;
      text-align: center;
      display: flex;
      flex-direction: column;
      flex-grow: 1;
      justify-content: space-between;
    }

    .title {
      font-size: 1.1rem;
      font-weight: bold;
      margin-bottom: 8px;
    }

    .price-group {
      font-size: 0.95rem;
      margin-bottom: 12px;
    }

    .original-price {
      text-decoration: line-through;
      color: #aaa;
      margin-right: 8px;
    }

    .special-price {
      color: #ff4d4d;
      font-weight: bold;
      font-size: 1.1rem;
    }

    .quantity-control {
      display: flex;
      justify-content: center;
      align-items: center;
      margin-bottom: 10px;
      gap: 12px;
    }

    .qty-btn {
      background-color: #333;
      color: #fff;
      border: 1px solid #555;
      width: 32px;
      height: 32px;
      border-radius: 6px;
      font-size: 1.2rem;
      font-weight: bold;
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      user-select: none;
    }

    .qty-btn:active {
      background-color: #555;
    }

    .qty-number {
      font-size: 1.1rem;
      font-weight: bold;
      min-width: 24px;
    }

    .add-cart-btn {
      width: 100%;
      padding: 10px;
      background-color: #333;
      color: #fff;
      border: 1px solid #555;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.95rem;
      font-weight: bold;
      transition: all 0.2s;
    }

    .add-cart-btn:hover {
      background-color: #444;
    }

    .add-cart-btn.selected {
      background-color: #28a745;
      color: #fff;
      border-color: #28a745;
    }

    .floating-cart {
      position: fixed;
      bottom: 20px;
      right: 20px;
      background-color: #06C755;
      color: #fff;
      padding: 14px 24px;
      border-radius: 50px;
      cursor: pointer;
      font-size: 1rem;
      font-weight: bold;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
      display: none;
      z-index: 1000;
      transition: transform 0.2s;
    }

    .floating-cart:hover {
      transform: scale(1.05);
    }

    /* 🚀 側邊浮動按鈕群 (回到頂部 + LINE客服) */
    .floating-tools {
      position: fixed;
      bottom: 80px; 
      right: 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      z-index: 999;
      opacity: 0; /* 預設隱藏，滑動後才出現 */
      pointer-events: none;
      transition: opacity 0.3s;
    }

    .tool-btn {
      width: 45px;
      height: 45px;
      border-radius: 50%;
      background-color: #333;
      color: #fff;
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
      transition: all 0.2s;
      text-decoration: none;
      font-size: 1.2rem;
    }

    .tool-btn:hover {
      transform: scale(1.1);
    }

    .tool-btn.line-btn {
      background-color: #00c300; 
      font-size: 1.5rem;
    }

    #loading {
      text-align: center;
      font-size: 1.2rem;
      color: #666;
      padding: 50px;
      width: 100%;
    }
  </style>
</head>
<body>

  <div id="loading">載入商品目錄中...</div>

  <!-- 📢 公告區 (文字可以隨時修改) -->
  <div class="announcement">
    📢 <strong>最新公告：</strong> 歡迎光臨 FONG 煙火精選目錄！目前中秋商品陸續上架中，庫存變動快，大量訂購請直接點擊右下方 LINE 圖示聯繫客服確認現貨。
  </div>
  
  <!-- 分類按鈕容器 -->
  <div class="category-nav" id="category-nav"></div> 

  <!-- 產品卡片容器 -->
  <div class="container" id="product-container"></div>

  <!-- 購物車送出按鈕 -->
  <div class="floating-cart" id="floating-cart" onclick="sendToLine()">
    🛒 已選取 <span id="cart-count">0</span> 項（點此傳送至 LINE）
  </div>

  <!-- 🚀 側邊浮動按鈕 (LINE + 回到頂部) -->
  <div class="floating-tools" id="floating-tools">
    <!-- ⚠️ 請將下方的 href 換成你自己的 LINE 加好友連結 -->
    <a href="https://line.me/ti/p/YOUR_LINE_ID" target="_blank" class="tool-btn line-btn" title="加 LINE 好友">
      💬
    </a>
    <div class="tool-btn" onclick="window.scrollTo({top: 0, behavior: 'smooth'})" title="回到頂部">
      ⬆️
    </div>
  </div>

  <script>
    const GAS_API_URL = "https://script.google.com/macros/s/AKfycbzdvebTnsOSgEURWczwLjLuQPIz9tbHWKSpEIgsT38V5jR7vzHUHbFiPGtH5F0rQJEZWA/exec";

    let products = [];
    const selectedItems = {};
    let currentCategory = '全部'; 

    function getEmbedUrl(url) {
      if (!url) return '';
      let videoId = '';
      if (url.includes('v=')) {
        videoId = url.split('v=')[1].split('&')[0];
      } else if (url.includes('youtu.be/')) {
        videoId = url.split('youtu.be/')[1].split('?')[0];
      }
      return `https://www.youtube.com/embed/${videoId}?enablejsapi=1`;
    }

    async function loadProducts() {
      const cachedData = localStorage.getItem('fong_products_cache');
      if (cachedData) {
        try {
          products = JSON.parse(cachedData);
          document.getElementById('loading').style.display = 'none';
          renderCategories();
          renderProducts();
        } catch (e) {
          console.error('快取解析失敗', e);
        }
      }

      try {
        const cacheBuster = (GAS_API_URL.includes('?') ? '&' : '?') + 't=' + new Date().getTime();
        const response = await fetch(GAS_API_URL + cacheBuster, { cache: 'no-store' });
        const data = await response.json();
        
        const freshProducts = [];
        data.forEach(item => {
          if (!item['商品名稱']) return;
          freshProducts.push({
            title: item['商品名稱'] || '',
            image: item['圖片檔名'] || '',
            youtube: item['影片網址'] || '',
            originalPrice: item['原價'] || '',
            specialPrice: item['特價'] || '',
            status: item['狀態'] || '',
            category: item['分類'] || '其他' 
          });
        });

        const freshDataStr = JSON.stringify(freshProducts);
        if (freshDataStr !== cachedData) {
          localStorage.setItem('fong_products_cache', freshDataStr);
          products = freshProducts;
          document.getElementById('loading').style.display = 'none';
          renderCategories();
          renderProducts();
        }
      } catch (error) {
        console.error('背景同步失敗:', error);
        if (!cachedData) {
          document.getElementById('loading').innerText = '商品載入失敗，請檢查網路連線。';
        }
      }
    }

    function renderCategories() {
      const nav = document.getElementById('category-nav');
      const uniqueCategories = ['全部', ...new Set(products.map(p => p.category))];
      nav.innerHTML = uniqueCategories.map(cat => 
        `<button class="cat-btn ${cat === currentCategory ? 'active' : ''}" onclick="setCategory('${cat}')">${cat}</button>`
      ).join('');
    }

    function setCategory(cat) {
      currentCategory = cat;
      renderCategories(); 
      renderProducts();   
    }

    function renderProducts() {
      const container = document.getElementById('product-container');
      container.innerHTML = '';

      products.forEach((item, index) => {
        const statusStr = (item.status || '').toString().trim().toUpperCase();
        if (statusStr === 'N' || statusStr === '下架') {
          return;
        }

        if (currentCategory !== '全部' && item.category !== currentCategory) {
          return;
        }

        const embedUrl = getEmbedUrl(item.youtube);
        const card = document.createElement('div');
        card.className = 'product-card';
        
        card.innerHTML = `
          <div class="media-container" id="media-${index}" onclick="playVideo(${index})">
            <img src="${item.image}" alt="${item.title}" onerror="this.src='https://via.placeholder.com/300x220?text=無圖片';">
            <div class="play-button"></div>
            <iframe id="iframe-${index}" src="${embedUrl}" title="${item.title}" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
          </div>
          <div class="card-info">
            <div>
              <div class="title">${item.title}</div>
              <div class="price-group">
                售價 <span class="original-price">NT$${item.originalPrice}</span>
                特價 <span class="special-price">NT$${item.specialPrice}</span>
              </div>
            </div>

            <div class="quantity-control">
              <div class="qty-btn" onclick="changeQty(${index}, -1)">-</div>
              <span class="qty-number" id="qty-${index}">1</span>
              <div class="qty-btn" onclick="changeQty(${index}, 1)">+</div>
            </div>

            <button class="add-cart-btn" id="btn-${index}" onclick="toggleSelect('${item.title}', ${index})">
              ＋ 加入購買清單
            </button>
          </div>
        `;
        container.appendChild(card);
      });
      
      syncCartButtons();
    }

    function syncCartButtons() {
      products.forEach((item, index) => {
        const btn = document.getElementById(`btn-${index}`);
        if (btn) {
          if (selectedItems[item.title]) {
            btn.innerText = '✓ 已加入清單';
            btn.classList.add('selected');
            document.getElementById(`qty-${index}`).innerText = selectedItems[item.title];
          } else {
            btn.innerText = '＋ 加入購買清單';
            btn.classList.remove('selected');
            document.getElementById(`qty-${index}`).innerText = 1;
          }
        }
      });
    }

    function playVideo(index) {
      products.forEach((_, i) => {
        if (i !== index) {
          const otherMediaBox = document.getElementById(`media-${i}`);
          const otherIframe = document.getElementById(`iframe-${i}`);
          if (otherMediaBox && otherMediaBox.classList.contains('playing')) {
            otherMediaBox.classList.remove('playing');
            otherIframe.src = otherIframe.src.replace('&autoplay=1', '').replace('?autoplay=1', '');
          }
        }
      });

      const mediaBox = document.getElementById(`media-${index}`);
      const iframe = document.getElementById(`iframe-${index}`);
      mediaBox.classList.add('playing');
      let currentSrc = iframe.src;
      if (!currentSrc.includes('autoplay=1')) {
        iframe.src = currentSrc + (currentSrc.includes('?') ? '&' : '?') + 'autoplay=1';
      }
    }

    function changeQty(index, delta) {
      const qtySpan = document.getElementById(`qty-${index}`);
      let currentQty = parseInt(qtySpan.innerText);
      currentQty += delta;
      if (currentQty < 1) currentQty = 1;
      qtySpan.innerText = currentQty;

      const title = products[index].title;
      if (selectedItems[title]) {
        selectedItems[title] = currentQty;
      }
    }

    function toggleSelect(title, index) {
      const btn = document.getElementById(`btn-${index}`);
      const currentQty = parseInt(document.getElementById(`qty-${index}`).innerText);
      
      if (selectedItems[title]) {
        delete selectedItems[title];
        btn.innerText = '＋ 加入購買清單';
        btn.classList.remove('selected');
      } else {
        selectedItems[title] = currentQty;
        btn.innerText = '✓ 已加入清單';
        btn.classList.add('selected');
      }
      
      updateCartUI();
    }

    function updateCartUI() {
      const count = Object.keys(selectedItems).length;
      const cartBtn = document.getElementById('floating-cart');
      const countSpan = document.getElementById('cart-count');

      countSpan.innerText = count;
      cartBtn.style.display = count > 0 ? 'block' : 'none';
    }

    function sendToLine() {
      if (Object.keys(selectedItems).length === 0) return;

      let message = "你好！我想購買以下煙火商品：\n------------------------\n";
      for (let title in selectedItems) {
        message += `• ${title} x ${selectedItems[title]}\n`;
      }
      message += "------------------------\n請問目前都有現貨嗎？";

      const lineUrl = `https://line.me/R/msg/text/?${encodeURIComponent(message)}`;
      window.location.href = lineUrl;
    }

    // 監聽滾動事件，控制浮動按鈕顯示與隱藏
    window.addEventListener('scroll', () => {
      const tools = document.getElementById('floating-tools');
      if (window.scrollY > 200) {
        tools.style.opacity = '1';
        tools.style.pointerEvents = 'auto';
      } else {
        tools.style.opacity = '0';
        tools.style.pointerEvents = 'none';
      }
    });

    loadProducts();
  </script>

</body>
</html>
