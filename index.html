<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FONG 煙火精選目錄</title>

  <!-- LINE / 社交軟體 網址預覽卡片設定 (OG 標籤) -->
  <meta property="og:title" content="FONG 煙火精選商品目錄">
  <meta property="og:description" content="提供最新煙火款式、價格及現場施放影片展示，歡迎選購！">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://fong-shop.github.io/Fong/">
  <meta property="og:image" content="https://fong-shop.github.io/Fong/messageImage_1785794548467.jpg">

  <style>
    * { box-sizing: border-box; }
    body {
      font-family: Arial, sans-serif;
      background-color: #f4f4f4;
      margin: 0;
      padding: 20px 20px 80px 20px;
      display: flex;
      justify-content: center;
    }

    .container {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 20px;
      max-width: 1000px;
      width: 100%;
    }

    .product-card {
      background-color: #000;
      color: #fff;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.15);
      border: 2px solid #000;
      display: flex;
      flex-direction: column;
    }

    .media-container {
      position: relative;
      width: 100%;
      height: 220px;
      cursor: pointer;
      background-color: #222;
    }

    .media-container img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      position: absolute;
      top: 0;
      left: 0;
      z-index: 10;
      transition: opacity 0.3s;
    }

    .play-button {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 50px;
      height: 50px;
      background-color: rgba(0, 0, 0, 0.7);
      border-radius: 50%;
      border: 2px solid #fff;
      z-index: 20;
      display: flex;
      justify-content: center;
      align-items: center;
      transition: all 0.2s;
    }

    .play-button::after {
      content: '';
      display: block;
      width: 0;
      height: 0;
      border-style: solid;
      border-width: 10px 0 10px 18px;
      border-color: transparent transparent transparent #fff;
      margin-left: 4px;
    }

    .media-container:hover .play-button {
      transform: translate(-50%, -50%) scale(1.1);
      background-color: rgba(255, 0, 0, 0.85);
    }

    .media-container iframe {
      width: 100%;
      height: 100%;
      border: none;
      position: absolute;
      top: 0;
      left: 0;
      z-index: 5;
    }

    .media-container.playing img,
    .media-container.playing .play-button {
      opacity: 0;
      pointer-events: none;
    }

    .card-info {
      padding: 15px;
      text-align: center;
      display: flex;
      flex-direction: column;
      flex-grow: 1;
      justify-content: space-between;
    }

    .title {
      font-size: 1.1rem;
      font-weight: bold;
      margin-bottom: 8px;
    }

    .price-group {
      font-size: 0.95rem;
      margin-bottom: 12px;
    }

    .original-price {
      text-decoration: line-through;
      color: #aaa;
      margin-right: 8px;
    }

    .special-price {
      color: #ff4d4d;
      font-weight: bold;
      font-size: 1.1rem;
    }

    .quantity-control {
      display: flex;
      justify-content: center;
      align-items: center;
      margin-bottom: 10px;
      gap: 12px;
    }

    .qty-btn {
      background-color: #333;
      color: #fff;
      border: 1px solid #555;
      width: 32px;
      height: 32px;
      border-radius: 6px;
      font-size: 1.2rem;
      font-weight: bold;
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      user-select: none;
    }

    .qty-btn:active {
      background-color: #555;
    }

    .qty-number {
      font-size: 1.1rem;
      font-weight: bold;
      min-width: 24px;
    }

    .add-cart-btn {
      width: 100%;
      padding: 10px;
      background-color: #333;
      color: #fff;
      border: 1px solid #555;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.95rem;
      font-weight: bold;
      transition: all 0.2s;
    }

    .add-cart-btn:hover {
      background-color: #444;
    }

    .add-cart-btn.selected {
      background-color: #28a745;
      color: #fff;
      border-color: #28a745;
    }

    .floating-cart {
      position: fixed;
      bottom: 20px;
      right: 20px;
      background-color: #06C755;
      color: #fff;
      padding: 14px 24px;
      border-radius: 50px;
      cursor: pointer;
      font-size: 1rem;
      font-weight: bold;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
      display: none;
      z-index: 1000;
      transition: transform 0.2s;
    }

    .floating-cart:hover {
      transform: scale(1.05);
    }

    #loading {
      text-align: center;
      font-size: 1.2rem;
      color: #666;
      padding: 50px;
    }
  </style>
</head>
<body>

  <div id="loading">載入商品目錄中...</div>
  <div class="container" id="product-container"></div>

  <div class="floating-cart" id="floating-cart" onclick="sendToLine()">
    🛒 已選取 <span id="cart-count">0</span> 項（點此傳送至 LINE 訂購）
  </div>

  <script>
    // 你的 Google 試算表 ID（從截圖網址提取）
    const SHEET_ID = "1HpBJznGZD03UFCpaw5BQCybonLods7HdgZfTzjpAWHw";
    const SHEET_URL = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json`;

    let products = [];
    const selectedItems = {};

    function getEmbedUrl(url) {
      if (!url) return '';
      let videoId = '';
      if (url.includes('v=')) {
        videoId = url.split('v=')[1].split('&')[0];
      } else if (url.includes('youtu.be/')) {
        videoId = url.split('youtu.be/')[1].split('?')[0];
      }
      return `https://www.youtube.com/embed/${videoId}?enablejsapi=1`;
    }

    async function loadProducts() {
      try {
        const response = await fetch(SHEET_URL);
        const text = await response.text();
        
        // 剖析 Google GViz 回傳的 JSON 格式
        const jsonString = text.substring(47, text.length - 2);
        const json = JSON.parse(jsonString);
        
        const rows = json.table.rows;
        
        // 解析第一列之後的所有資料列
        products = rows.map(row => {
          const c = row.c;
          return {
            title: c[0] ? c[0].v : '',
            image: c[1] ? c[1].v : '',
            youtube: c[2] ? c[2].v : '',
            originalPrice: c[3] ? c[3].v : '',
            specialPrice: c[4] ? c[4].v : '',
            status: c[5] ? c[5].v : ''
          };
        });

        document.getElementById('loading').style.display = 'none';
        renderProducts();
      } catch (error) {
        console.error('載入資料失敗:', error);
        document.getElementById('loading').innerText = '商品載入失敗，請檢查試算表權限。';
      }
    }

    function renderProducts() {
      const container = document.getElementById('product-container');
      container.innerHTML = '';

      products.forEach((item, index) => {
        // 判斷下架狀態
        if (item.status && (item.status.toString().toUpperCase() === 'N' || item.status === '下架')) {
          return;
        }

        const embedUrl = getEmbedUrl(item.youtube);
        const card = document.createElement('div');
        card.className = 'product-card';
        
        card.innerHTML = `
          <div class="media-container" id="media-${index}" onclick="playVideo(${index})">
            <img src="${item.image}" alt="${item.title}" onerror="this.src='https://via.placeholder.com/300x220?text=無圖片';">
            <div class="play-button"></div>
            <iframe id="iframe-${index}" src="${embedUrl}" title="${item.title}" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
          </div>
          <div class="card-info">
            <div>
              <div class="title">${item.title}</div>
              <div class="price-group">
                售價 <span class="original-price">NT$${item.originalPrice}</span>
                特價 <span class="special-price">NT$${item.specialPrice}</span>
              </div>
            </div>

            <div class="quantity-control">
              <div class="qty-btn" onclick="changeQty(${index}, -1)">-</div>
              <span class="qty-number" id="qty-${index}">1</span>
              <div class="qty-btn" onclick="changeQty(${index}, 1)">+</div>
            </div>

            <button class="add-cart-btn" id="btn-${index}" onclick="toggleSelect('${item.title}', ${index})">
              ＋ 加入購買清單
            </button>
          </div>
        `;
        container.appendChild(card);
      });
    }

    function playVideo(index) {
      const mediaBox = document.getElementById(`media-${index}`);
      const iframe = document.getElementById(`iframe-${index}`);
      mediaBox.classList.add('playing');
      let currentSrc = iframe.src;
      if (!currentSrc.includes('autoplay=1')) {
        iframe.src = currentSrc + (currentSrc.includes('?') ? '&' : '?') + 'autoplay=1';
      }
    }

    function changeQty(index, delta) {
      const qtySpan = document.getElementById(`qty-${index}`);
      let currentQty = parseInt(qtySpan.innerText);
      currentQty += delta;
      if (currentQty < 1) currentQty = 1;
      qtySpan.innerText = currentQty;

      const title = products[index].title;
      if (selectedItems[title]) {
        selectedItems[title] = currentQty;
      }
    }

    function toggleSelect(title, index) {
      const btn = document.getElementById(`btn-${index}`);
      const currentQty = parseInt(document.getElementById(`qty-${index}`).innerText);
      
      if (selectedItems[title]) {
        delete selectedItems[title];
        btn.innerText = '＋ 加入購買清單';
        btn.classList.remove('selected');
      } else {
        selectedItems[title] = currentQty;
        btn.innerText = '✓ 已加入清單';
        btn.classList.add('selected');
      }
      
      updateCartUI();
    }

    function updateCartUI() {
      const count = Object.keys(selectedItems).length;
      const cartBtn = document.getElementById('floating-cart');
      const countSpan = document.getElementById('cart-count');

      countSpan.innerText = count;
      cartBtn.style.display = count > 0 ? 'block' : 'none';
    }

    function sendToLine() {
      if (Object.keys(selectedItems).length === 0) return;

      let message = "你好！我想購買以下煙火商品：\n------------------------\n";
      for (let title in selectedItems) {
        message += `• ${title} x ${selectedItems[title]}\n`;
      }
      message += "------------------------\n請問目前都有現貨嗎？";

      const lineUrl = `https://line.me/R/msg/text/?${encodeURIComponent(message)}`;
      window.location.href = lineUrl;
    }

    loadProducts();
  </script>

</body>
</html>
