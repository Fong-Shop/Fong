<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FONG 煙火精選目錄</title>

  <!-- LINE / 社交軟體 網址預覽卡片設定 (OG 標籤) -->
  <meta property="og:title" content="FONG 煙火精選商品目錄">
  <meta property="og:description" content="提供最新煙火款式、價格及現場施放影片展示，歡迎選購！">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://fong-shop.github.io/Fong/">
  <meta property="og:image" content="https://fong-shop.github.io/Fong/messageImage_1785794548467.jpg">

  <style>
    * { box-sizing: border-box; }
    body {
      font-family: Arial, sans-serif;
      background-color: #f4f4f4;
      margin: 0;
      padding: 20px 20px 80px 20px; /* 底部留白避免被浮動按鈕擋住 */
      display: flex;
      justify-content: center;
    }

    .container {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 20px;
      max-width: 1000px;
      width: 100%;
    }

    .product-card {
      background-color: #000;
      color: #fff;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.15);
      border: 2px solid #000;
      display: flex;
      flex-direction: column;
    }

    /* 圖片與影片容器 */
    .media-container {
      position: relative;
      width: 100%;
      height: 220px;
      cursor: pointer;
      background-color: #222;
    }

    /* 封面圖 */
    .media-container img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      position: absolute;
      top: 0;
      left: 0;
      z-index: 10;
      transition: opacity 0.3s;
    }

    /* 播放按鈕圖示 */
    .play-button {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 50px;
      height: 50px;
      background-color: rgba(0, 0, 0, 0.7);
      border-radius: 50%;
      border: 2px solid #fff;
      z-index: 20;
      display: flex;
      justify-content: center;
      align-items: center;
      transition: all 0.2s;
    }

    .play-button::after {
      content: '';
      display: block;
      width: 0;
      height: 0;
      border-style: solid;
      border-width: 10px 0 10px 18px;
      border-color: transparent transparent transparent #fff;
      margin-left: 4px;
    }

    .media-container:hover .play-button {
      transform: translate(-50%, -50%) scale(1.1);
      background-color: rgba(255, 0, 0, 0.85);
    }

    /* 預藏 iframe 影片 */
    .media-container iframe {
      width: 100%;
      height: 100%;
      border: none;
      position: absolute;
      top: 0;
      left: 0;
      z-index: 5;
    }

    /* 點擊播放後，隱藏封面圖與播放按鈕 */
    .media-container.playing img,
    .media-container.playing .play-button {
      opacity: 0;
      pointer-events: none;
    }

    /* 文字欄位 */
    .card-info {
      padding: 15px;
      text-align: center;
      display: flex;
      flex-direction: column;
      flex-grow: 1;
      justify-content: space-between;
    }

    .title {
      font-size: 1.1rem;
      font-weight: bold;
      margin-bottom: 8px;
    }

    .price-group {
      font-size: 0.95rem;
      margin-bottom: 12px;
    }

    .original-price {
      text-decoration: line-through;
      color: #aaa;
      margin-right: 8px;
    }

    .special-price {
      color: #ff4d4d;
      font-weight: bold;
      font-size: 1.1rem;
    }

    /* 加入選單按鈕 */
    .add-cart-btn {
      width: 100%;
      padding: 10px;
      background-color: #333;
      color: #fff;
      border: 1px solid #555;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.95rem;
      font-weight: bold;
      transition: all 0.2s;
    }

    .add-cart-btn:hover {
      background-color: #444;
    }

    .add-cart-btn.selected {
      background-color: #28a745;
      color: #fff;
      border-color: #28a745;
    }

    /* 右下角浮動購物車按鈕 */
    .floating-cart {
      position: fixed;
      bottom: 20px;
      right: 20px;
      background-color: #06C755; /* LINE 代表色 */
      color: #fff;
      padding: 14px 24px;
      border-radius: 50px;
      cursor: pointer;
      font-size: 1rem;
      font-weight: bold;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
      display: none;
      z-index: 1000;
      transition: transform 0.2s;
    }

    .floating-cart:hover {
      transform: scale(1.05);
    }
  </style>
</head>
<body>

  <!-- 自動渲染卡片的容器 -->
  <div class="container" id="product-container"></div>

  <!-- 浮動 LINE 結帳按鈕 -->
  <div class="floating-cart" id="floating-cart" onclick="sendToLine()">
    🛒 已選取 <span id="cart-count">0</span> 項（點此傳送至 LINE 詢問）
  </div>

  <script>
    // ========================================================
    // ⬇️【商品資料編輯區】⬇️
    // ========================================================
    const products = [
      {
        title: "蘋果小高空(大花)",
        image: "511198_0.jpg",
        youtube: "https://www.youtube.com/watch?v=IyQ0Q_4oKbo",
        originalPrice: 150,
        specialPrice: 50
      },
      {
        title: "雙泡泡小高空(雙花)",
        image: "511200_0.jpg",
        youtube: "https://www.youtube.com/watch?v=pSP0lhrX5dI",
        originalPrice: 150,
        specialPrice: 50
      },
      {
        title: "炸花大吐珠(不吐)",
        image: "1039713.jpg",
        youtube: "https://www.youtube.com/watch?v=ZVFhPoESh-4",
        originalPrice: 150,
        specialPrice: 50
      },
      {
        title: "一發入魂(特效花束)",
        image: "messageImage_1780785895048.jpg",
        youtube: "https://www.youtube.com/watch?v=ZneElIbg91A",
        originalPrice: 150,
        specialPrice: 50
      },
    ];

    // 儲存被選中的商品名稱
    const selectedItems = new Set();

    // 抓取 YouTube ID 並轉成內嵌網址
    function getEmbedUrl(url) {
      if (!url) return '';
      let videoId = '';
      if (url.includes('v=')) {
        videoId = url.split('v=')[1].split('&')[0];
      } else if (url.includes('youtu.be/')) {
        videoId = url.split('youtu.be/')[1].split('?')[0];
      }
      return `https://www.youtube.com/embed/${videoId}?enablejsapi=1`;
    }

    // 動態生成 HTML 商品卡片
    const container = document.getElementById('product-container');

    products.forEach((item, index) => {
      const embedUrl = getEmbedUrl(item.youtube);
      const card = document.createElement('div');
      card.className = 'product-card';
      
      card.innerHTML = `
        <div class="media-container" id="media-${index}" onclick="playVideo(${index})">
          <img src="${item.image}" alt="${item.title}" onerror="this.src='https://via.placeholder.com/300x220?text=無圖片';">
          <div class="play-button"></div>
          <iframe id="iframe-${index}" src="${embedUrl}" title="${item.title}" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
        </div>
        <div class="card-info">
          <div>
            <div class="title">${item.title}</div>
            <div class="price-group">
              售價 <span class="original-price">NT$${item.originalPrice}</span>
              特價 <span class="special-price">NT$${item.specialPrice}</span>
            </div>
          </div>
          <button class="add-cart-btn" id="btn-${index}" onclick="toggleSelect('${item.title}', ${index})">
            ＋ 加入詢問清單
          </button>
        </div>
      `;
      container.appendChild(card);
    });

    // 點擊播放影片邏輯
    function playVideo(index) {
      const mediaBox = document.getElementById(`media-${index}`);
      const iframe = document.getElementById(`iframe-${index}`);

      mediaBox.classList.add('playing');

      let currentSrc = iframe.src;
      if (!currentSrc.includes('autoplay=1')) {
        iframe.src = currentSrc + (currentSrc.includes('?') ? '&' : '?') + 'autoplay=1';
      }
    }

    // 切換商品選擇狀態
    function toggleSelect(title, index) {
      const btn = document.getElementById(`btn-${index}`);
      
      if (selectedItems.has(title)) {
        selectedItems.delete(title);
        btn.innerText = '＋ 加入詢問清單';
        btn.classList.remove('selected');
      } else {
        selectedItems.add(title);
        btn.innerText = '✓ 已加入清單';
        btn.classList.add('selected');
      }
      
      updateCartUI();
    }

    // 更新浮動按鈕顯示
    function updateCartUI() {
      const count = selectedItems.size;
      const cartBtn = document.getElementById('floating-cart');
      const countSpan = document.getElementById('cart-count');

      countSpan.innerText = count;

      if (count > 0) {
        cartBtn.style.display = 'block';
      } else {
        cartBtn.style.display = 'none';
      }
    }

    // 打開 LINE 並帶入點單文字
    function sendToLine() {
      if (selectedItems.size === 0) return;

      let message = "你好！我想詢問/購買以下煙火商品：\n------------------------\n";
      selectedItems.forEach(item => {
        message += `• ${item}\n`;
      });
      message += "------------------------\n請問目前都有現貨嗎？";

      // 轉成 LINE 的分享連結 (encodeURIComponent 避免中文亂碼)
      const lineUrl = `https://line.me/R/msg/text/?${encodeURIComponent(message)}`;
      window.location.href = lineUrl;
    }
  </script>

</body>
</html>
