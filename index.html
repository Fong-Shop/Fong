<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>商品目錄</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f4f4f4;
      margin: 0;
      padding: 20px;
      display: flex;
      justify-content: center;
    }

    .container {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 20px;
      max-width: 1000px;
      width: 100%;
    }

    .product-card {
      background-color: #000;
      color: #fff;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.15);
      border: 2px solid #000;
      display: flex;
      flex-direction: column;
    }

    /* 讓影片和圖片保持統一的比例與大小 */
    .product-card iframe,
    .product-card img {
      width: 100%;
      height: 250px;
      border: none;
      object-fit: cover;
    }

    .card-info {
      padding: 15px;
      text-align: center;
    }

    .title {
      font-size: 1.2rem;
      font-weight: bold;
      margin-bottom: 8px;
    }

    .price-group {
      font-size: 0.95rem;
    }

    .original-price {
      text-decoration: line-through;
      color: #aaa;
      margin-right: 8px;
    }

    .special-price {
      color: #ff4d4d;
      font-weight: bold;
      font-size: 1.1rem;
    }
  </style>
</head>
<body>

  <div class="container">

    <!-- 第一款商品：蘋果小高空(大花) [內嵌 YouTube 影片] -->
    <div class="product-card">
      <iframe 
        src="https://www.youtube.com/embed/IyQ0Q_4oKbo" 
        title="蘋果小高空(大花)" 
        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
        allowfullscreen>
      </iframe>
      <div class="card-info">
        <div class="title">蘋果小高空(大花)</div>
        <div class="price-group">
          售價 <span class="original-price">NT$150</span>
          特價 <span class="special-price">NT$50</span>
        </div>
      </div>
    </div>

    <!-- 第二款商品：雙泡泡小高空(雙花) [保持圖片/預留替換] -->
    <div class="product-card">
      <img src="你的圖片檔名.jpg" alt="雙泡泡小高空(雙花)">
      <div class="card-info">
        <div class="title">雙泡泡小高空(雙花)</div>
        <div class="price-group">
          售價 <span class="original-price">NT$150</span>
          特價 <span class="special-price">NT$50</span>
        </div>
      </div>
    </div>

  </div>

</body>
</html>
