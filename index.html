<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FONG 煙火精選目錄</title>

  <meta property="og:title" content="FONG 煙火精選商品目錄">
  <meta property="og:description" content="提供最新煙火款式、套裝優惠、價格及施放影片展示，歡迎選購！">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://fong-shop.github.io/Fong/">
  <meta property="og:image" content="https://fong-shop.github.io/Fong/messageImage_1785794548467.jpg">

  <style>
    * { box-sizing: border-box; }
    body {
      font-family: Arial, sans-serif; background-color: #f4f4f4;
      margin: 0; padding: 20px 20px 140px 20px;
      display: flex; flex-direction: column; align-items: center;
    }
    .announcement {
      width: 100%; max-width: 1000px; background-color: #fff3cd; 
      color: #856404; padding: 12px 20px; border-radius: 8px;
      margin-bottom: 15px; border-left: 5px solid #ffc107;
      font-size: 0.95rem; line-height: 1.5;
      box-shadow: 0 2px 5px rgba(0,0,0,0.05); display: none; 
    }

    .category-nav {
      display: flex; gap: 12px; margin-bottom: 25px; overflow-x: auto;
      padding-bottom: 5px; max-width: 1000px; width: 100%; scrollbar-width: none; 
    }
    .category-nav::-webkit-scrollbar { display: none; }
    .cat-btn {
      padding: 10px 20px; background-color: #333; color: #fff;
      border: 1px solid #555; border-radius: 25px; cursor: pointer;
      font-size: 1rem; white-space: nowrap; transition: all 0.2s;
    }
    .cat-btn:hover { background-color: #444; }
    .cat-btn.active { background-color: #ff4d4d; border-color: #ff4d4d; font-weight: bold; }

    .container {
      display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 20px; max-width: 1000px; width: 100%;
    }
    .product-card {
      background-color: #000; color: #fff; border-radius: 12px; overflow: hidden;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.15); border: 2px solid #000;
      display: flex; flex-direction: column; transition: box-shadow 0.3s ease;
    }

    .media-container { position: relative; width: 100%; height: 220px; cursor: pointer; background-color: #222; }
    .media-container img {
      width: 100%; height: 100%; object-fit: cover; position: absolute;
      top: 0; left: 0; z-index: 10; transition: opacity 0.3s;
    }

    .play-button {
      position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
      width: 50px; height: 50px; background-color: rgba(0, 0, 0, 0.7);
      border-radius: 50%; border: 2px solid #fff; z-index: 20;
      display: flex; justify-content: center; align-items: center; transition: all 0.2s;
    }
    .play-button::after {
      content: ''; display: block; width: 0; height: 0;
      border-style: solid; border-width: 10px 0 10px 18px;
      border-color: transparent transparent transparent #fff; margin-left: 4px;
    }
    .media-container:hover .play-button { transform: translate(-50%, -50%) scale(1.1); background-color: rgba(255, 0, 0, 0.85); }
    .media-container iframe { width: 100%; height: 100%; border: none; position: absolute; top: 0; left: 0; z-index: 5; }
    .media-container.playing img, .media-container.playing .play-button { opacity: 0; pointer-events: none; }

    .card-info { padding: 16px; text-align: center; display: flex; flex-direction: column; flex-grow: 1; justify-content: space-between; }
    .title { font-size: 1.15rem; font-weight: bold; margin-bottom: 8px; }
    
    .package-items-box {
      background: #181818; border-radius: 8px; padding: 10px; margin-bottom: 12px; text-align: left;
      border: 1px solid #333;
    }
    .package-items-title { font-size: 0.8rem; color: #888; margin-bottom: 6px; font-weight: bold; }
    .package-item-tag {
      display: inline-flex; align-items: center; justify-content: space-between; width: 100%;
      background: #252525; padding: 6px 8px; margin-bottom: 4px; border-radius: 4px;
      font-size: 0.88rem; color: #fff; cursor: pointer; border: 1px solid #3a3a3a; transition: 0.2s;
    }
    .package-item-tag:hover { border-color: #ff4d4d; background: #2f2f2f; }
    .package-item-tag .view-badge {
      font-size: 0.75rem; color: #ffcc00; background: #3a3311; padding: 2px 6px; border-radius: 3px;
    }

    .price-group { font-size: 0.95rem; margin-bottom: 12px; }
    .original-price { text-decoration: line-through; color: #aaa; margin-right: 8px; }
    .special-price { color: #ff4d4d; font-weight: bold; font-size: 1.15rem; }

    .quantity-control { display: flex; justify-content: center; align-items: center; margin-bottom: 10px; gap: 12px; }
    .qty-btn {
      background-color: #333; color: #fff; border: 1px solid #555;
      width: 32px; height: 32px; border-radius: 6px; font-size: 1.2rem;
      font-weight: bold; cursor: pointer; display: flex; justify-content: center; align-items: center; user-select: none;
    }
    .qty-btn:active { background-color: #555; }
    .qty-number { font-size: 1.1rem; font-weight: bold; min-width: 24px; }

    .add-cart-btn {

      font-size: 0.95rem; font-weight: bold; transition: all 0.2s;
    }
    .add-cart-btn:hover { background-color: #444; }
    .add-cart-btn.selected { background-color: #28a745; color: #fff; border-color: #28a745; }

    /* 🛒 底部置中浮動結帳按鈕 */
    .floating-cart {
      position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
      background-color: #06C755; color: #fff; padding: 13px 26px; border-radius: 50px;
      cursor: pointer; font-size: 1rem; font-weight: bold; box-shadow: 0 4px 15px rgba(0, 0, 0, 0.35);

    }

    /* 🎁 左下角獨立直立滿額贈徽章 */
    .floating-left-reward {
      position: fixed; bottom: 85px; left: 20px;

    .floating-left-reward .v-bar-bg {
      width: 6px; height: 35px; background: #444; border-radius: 3px; overflow: hidden;
      display: flex; flex-direction: column; justify-content: flex-end;

    .floating-left-reward .v-bar-fill {

    }

    /* 🚀 右側直立工具群組 (置頂在上方，LINE在最下方) */
    .floating-tools {
      position: fixed; bottom: 85px; right: 20px;
      display: flex; flex-direction: column; align-items: center;
      gap: 12px; z-index: 999;
    }

    .tool-btn {
      width: 45px; height: 45px; border-radius: 50%; background-color: #333;
      color: #fff; display: flex; justify-content: center; align-items: center;
      cursor: pointer; box-shadow: 0 4px 10px rgba(0,0,0,0.3); transition: all 0.2s;
      text-decoration: none; font-size: 1.2rem;
    }
    .tool-btn:hover { transform: scale(1.1); }
    .tool-btn.line-btn { background-color: #00c300; font-size: 1.5rem; }

    #scroll-top-btn {
      opacity: 0; pointer-events: none; transition: opacity 0.3s;
    }

    #loading { text-align: center; font-size: 1.2rem; color: #666; padding: 50px; width: 100%; }

    /* 🎁 彈窗樣式 */
    .popup-overlay {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background-color: rgba(0, 0, 0, 0.85); z-index: 2000; display: none; 
      justify-content: center; align-items: center; padding: 15px; backdrop-filter: blur(3px);
    }
    .popup-content {
      position: relative; max-width: 480px; width: 100%; max-height: 85vh;
      background: #181818; border-radius: 14px; border: 2px solid #ff4d4d;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6); padding: 22px 16px;
      animation: popIn 0.3s ease forwards; text-align: center;
      display: flex; flex-direction: column; overflow: hidden;
    }
    @keyframes popIn { 0% { transform: scale(0.9); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
    .popup-close {
      position: absolute; top: -12px; right: -12px; width: 34px; height: 34px; 
      background-color: #fff; color: #000; border-radius: 50%; display: flex; 
      justify-content: center; align-items: center; font-size: 1.1rem; font-weight: bold; 
      cursor: pointer; box-shadow: 0 2px 8px rgba(0,0,0,0.4); z-index: 2010; transition: transform 0.2s;
    }
    .popup-close:hover { transform: scale(1.15) rotate(90deg); }
    
    .popup-title { font-size: 1.25rem; font-weight: bold; color: #ffcc00; margin-bottom: 12px; }
    
    /* 🎁 彈窗流暢直列排版 (解決手機端雙欄長短不一問題) */
    .popup-items-wrapper {
      overflow-y: auto; display: flex; flex-direction: column; gap: 10px;
      padding-right: 4px; max-height: 68vh;
    }
    .popup-items-wrapper::-webkit-scrollbar { width: 5px; }
    .popup-items-wrapper::-webkit-scrollbar-thumb { background: #444; border-radius: 3px; }

    .popup-card {
      background: #000; border-radius: 10px; padding: 10px 12px; cursor: pointer;
      border: 1px solid #333; transition: all 0.2s; text-align: left;
      display: flex; align-items: center; justify-content: space-between; gap: 12px;
    }
    .popup-card:hover { border-color: #ff4d4d; background: #0d0d0d; }
    
    /* 單品帶圖風格 */
    .popup-card-thumb {
      width: 70px; height: 55px; border-radius: 6px; object-fit: cover; flex-shrink: 0;
    }
    .popup-card-main { flex-grow: 1; }
    .popup-card-title { color: #fff; font-size: 0.95rem; font-weight: bold; line-height: 1.3; }
    .popup-card-price { color: #ff4d4d; font-size: 0.95rem; font-weight: bold; margin-top: 4px; }
    .popup-card-action {
      background: #333; color: #ffcc00; padding: 6px 10px; border-radius: 6px;
      font-size: 0.8rem; font-weight: bold; white-space: nowrap; flex-shrink: 0;
    }

    /* 套裝展開卡片風格 */
    .popup-pkg-card {
      flex-direction: column; align-items: stretch; gap: 8px; border-color: #554411;
    }
    .popup-pkg-header {
      display: flex; justify-content: space-between; align-items: center;
    }
    .popup-pkg-title { color: #ffcc00; font-size: 1rem; font-weight: bold; }
    .popup-pkg-inner-box {
      background: #141414; border: 1px dashed #444; border-radius: 6px;
      padding: 8px 10px; font-size: 0.82rem; color: #ccc; line-height: 1.45;
    }
    .popup-pkg-bottom {
      display: flex; justify-content: space-between; align-items: center; margin-top: 2px;
    }

    /* 🛒 購物車視窗樣式 */
    .cart-modal-content {
      position: relative; max-width: 500px; width: 100%;
      background: #1a1a1a; border-radius: 12px; border: 2px solid #06C755;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5); padding: 22px 20px;
      animation: popIn 0.3s ease forwards; text-align: left;
      color: #fff; max-height: 85vh; display: flex; flex-direction: column;
    }
    .cart-items-container { overflow-y: auto; max-height: 48vh; margin-bottom: 12px; padding-right: 5px; }
    .cart-items-container::-webkit-scrollbar { width: 6px; }
    .cart-items-container::-webkit-scrollbar-thumb { background: #555; border-radius: 3px; }
    .cart-item {
      display: flex; justify-content: space-between; align-items: center;
      padding: 10px 0; border-bottom: 1px solid #333;
    }
    .cart-item-info { flex-grow: 1; padding-right: 10px; }
    .cart-item-title { font-weight: bold; font-size: 1.05rem; margin-bottom: 4px; }
    .cart-item-desc { font-size: 0.8rem; color: #ffcc00; margin-bottom: 4px; }
    .cart-item-price { color: #ff4d4d; font-size: 0.95rem; }
    .cart-item-actions { display: flex; align-items: center; gap: 8px; }
    .cart-del-btn {
      background-color: #ff4d4d; color: white; border: none; border-radius: 6px;
      width: 28px; height: 28px; font-weight: bold; cursor: pointer;
    }
    
    .order-inputs { display: flex; flex-direction: column; gap: 14px; margin: 15px 0 20px 0; }
    .order-input-group { display: flex; flex-direction: column; gap: 6px; }
    .order-input-group label { font-size: 0.9rem; color: #ccc; font-weight: bold; }
    .order-input-group input, .order-input-group textarea {
      width: 100%; background: #2a2a2a; border: 1px solid #555; color: #fff;
      padding: 10px 12px; border-radius: 6px; font-size: 1rem; outline: none;
    }
    .order-input-group input:focus, .order-input-group textarea:focus { border-color: #06C755; }
    .order-input-group textarea { resize: none; height: 75px; }

    .cart-total {
      text-align: right; font-size: 1.35rem; font-weight: bold; color: #ffcc00;
      padding: 12px 0 10px 0; border-top: 2px solid #444;
    }
    .btn-row { display: flex; gap: 10px; margin-top: 10px; }
    .btn-secondary {
      flex: 1; padding: 12px; background-color: #444; color: #fff; border: 1px solid #666;
      border-radius: 6px; font-size: 1rem; font-weight: bold; cursor: pointer; text-align: center;
    }
    .btn-primary {
      flex: 2; padding: 12px; background-color: #06C755; color: #fff; border: none;
      border-radius: 6px; font-size: 1.05rem; font-weight: bold; cursor: pointer; text-align: center;
    }
  </style>
</head>
<body>

  <!-- 🎁 動態彈出廣告視窗 -->
  <div class="popup-overlay" id="popup-overlay">
    <div class="popup-content">
      <div class="popup-close" onclick="closePopup()">✖</div>
      <div class="popup-title">🔥 限時特選推薦</div>
      <div class="popup-items-wrapper" id="popup-items-wrapper"></div>
    </div>
  </div>

  <!-- 🔍 單品詳情預覽小視窗 -->
  <div class="popup-overlay" id="product-detail-modal" style="z-index: 2500;">
    <div class="popup-content" style="max-width: 450px; padding: 20px;">
      <div class="popup-close" onclick="closeDetailModal()">✖</div>
      <div class="popup-title" id="detail-modal-title" style="margin-bottom: 12px;">商品詳情</div>
      
      <div class="media-container" id="detail-media-box" style="margin-bottom: 15px; border-radius: 8px; overflow: hidden; display:none;" onclick="playDetailVideo()">
        <img id="detail-img" src="" alt="商品圖片">
        <div class="play-button" id="detail-play-btn"></div>
        <iframe id="detail-iframe" src="" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
      </div>
      
      <div style="font-size: 0.95rem; color: #ccc; margin-bottom: 10px;">
        售價：<span id="detail-price" style="color: #ff4d4d; font-weight: bold; font-size: 1.1rem;"></span>
      </div>
      <button class="add-cart-btn selected" style="padding: 10px; background-color: #444; border:none;" onclick="closeDetailModal()">
        關閉預覽
      </button>
    </div>
  </div>

  <!-- 🛒 購物車確認視窗 -->
  <div class="popup-overlay" id="cart-modal-overlay">
    <div class="cart-modal-content">
      <div class="popup-close" onclick="closeCartModal()">✖</div>
      
      <!-- 步驟 1：核對清單 -->
      <div id="cart-step-1">
        <div class="popup-title" style="color: #06C755; margin-bottom: 10px;">🛒 購物清單確認 (1/2)</div>
        <div class="cart-items-container" id="cart-items-container"></div>
        <div id="cart-reward-hint" style="font-size: 0.9rem; color: #ffcc00; margin-bottom: 6px;"></div>
        <div class="cart-total">總金額：<span id="cart-total-price">NT$0</span></div>
        <button class="btn-primary" style="width: 100%; padding: 14px; font-size: 1.1rem;" onclick="goToCartStep2()">
          下一步：填寫備註資訊 ➔
        </button>
      </div>

      <!-- 步驟 2：填寫備註與送出 -->
      <div id="cart-step-2" style="display: none;">
        <div class="popup-title" style="color: #06C755; margin-bottom: 10px;">📝 訂購資訊確認 (2/2)</div>
        
        <div class="order-inputs">
          <div class="order-input-group">
            <label>您的稱呼 / 姓名（選填）：</label>
            <input type="text" id="order-customer-name" placeholder="例如：陳先生 / 林小姐">
          </div>
          <div class="order-input-group">
            <label>取貨時間 / 備註說明（選填）：</label>
            <textarea id="order-customer-note" placeholder="例如：中秋節當晚 8 點自取、需要提袋..."></textarea>
          </div>
        </div>

        <div class="cart-total" style="border: none; padding-top: 0;">結帳總額：<span id="cart-step2-total">NT$0</span></div>

        <div class="btn-row">
          <button class="btn-secondary" onclick="goToCartStep1()">⬅ 上一步修改</button>
          <button class="btn-primary" onclick="confirmSendToLine()">✅ 傳送至 LINE</button>
        </div>
      </div>

    </div>
  </div>

  <div id="loading">載入商品目錄中...</div>

  <div class="announcement" id="announcement-box"></div>
  <div class="category-nav" id="category-nav"></div> 
  <div class="container" id="product-container"></div>

  <!-- 🛒 底部置中結帳按鈕 -->
  <div class="floating-cart" id="floating-cart" onclick="openCartModal()">
    🛒 已選取 <span id="cart-count">0</span> 項（NT$0）
  </div>

  <!-- 🎁 左下角直立滿額贈徽章 -->
  <div class="floating-left-reward" id="floating-left-reward">
    <span style="font-weight: bold; color: #ffcc00;">滿額禮</span>
    <div class="v-bar-bg">
      <div class="v-bar-fill" id="floating-reward-bar"></div>
    </div>
    <span id="floating-reward-text" style="font-size: 0.65rem;">差$0</span>
  </div>

  <!-- 🚀 右側直立工具群組 (置頂按鈕在上，LINE在下) -->
  <div class="floating-tools" id="floating-tools">
    <div class="tool-btn" id="scroll-top-btn" onclick="window.scrollTo({top: 0, behavior: 'smooth'})" title="回到頂部">⬆️</div>
    <a href="#" target="_blank" class="tool-btn line-btn" id="line-link-btn" title="加 LINE 好友">💬</a>
  </div>

  <script>
    const GAS_API_URL = "https://script.google.com/macros/s/AKfycbzdvebTnsOSgEURWczwLjLuQPIz9tbHWKSpEIgsT38V5jR7vzHUHbFiPGtH5F0rQJEZWA/exec";

    let products = [];
    let siteSettings = {};
    const selectedItems = {}; 
    let currentCategory = '全部'; 
    let hasShownAdThisLoad = false; 

    function getEmbedUrl(url) {
      if (!url) return '';
      let videoId = '';
      if (url.includes('v=')) { videoId = url.split('v=')[1].split('&')[0]; } 
      else if (url.includes('youtu.be/')) { videoId = url.split('youtu.be/')[1].split('?')[0]; }
      return `https://www.youtube.com/embed/${videoId}?enablejsapi=1`;
    }

    function loadSavedCart() {
      const savedCart = localStorage.getItem('fong_shopping_cart');
      if (savedCart) {
        try {
          const parsed = JSON.parse(savedCart);
          Object.assign(selectedItems, parsed);
        } catch (e) { console.error('購物車讀取失敗'); }
      }
    }

    function saveCart() {
      localStorage.setItem('fong_shopping_cart', JSON.stringify(selectedItems));
    }

    async function loadProducts() {
      const cachedData = localStorage.getItem('fong_cache_v11');
      if (cachedData) {
        try {
          const parsed = JSON.parse(cachedData);
          products = parsed.products;
          siteSettings = parsed.settings || {};
          updateSettingsUI(siteSettings);
          document.getElementById('loading').style.display = 'none';
          
          loadSavedCart();
          renderCategories();
          renderProducts();
          updateCartUI();
        } catch (e) { console.error('快取解析失敗', e); }
      }

      try {
        const cacheBuster = (GAS_API_URL.includes('?') ? '&' : '?') + 't=' + new Date().getTime();
        const response = await fetch(GAS_API_URL + cacheBuster, { cache: 'no-store' });
        const data = await response.json(); 
        
        const freshProducts = [];
        const catalogItems = data.products || [];
        const packageItems = data.packages || [];

        catalogItems.forEach(item => {
          if (!item['商品名稱']) return;
          freshProducts.push({
            title: item['商品名稱'] || '',
            image: item['圖片檔名'] || '',
            youtube: item['影片網址'] || '',
            originalPrice: item['原價'] || '',
            specialPrice: item['特價'] || '',
            status: item['狀態'] || '',
            category: item['分類'] || '其他',
            isPackage: false
          });
        });

        packageItems.forEach(item => {
          if (!item['商品名稱']) return;
          const detail = item['包含內容'] || '';
          
          let calcOriginalPrice = 0;
          if (detail) {
            const parts = detail.split(/[,，、]/).map(s => s.trim()).filter(s => s);
            parts.forEach(pStr => {
              const match = pStr.match(/^(.*?)\s*[*xX]\s*(\d+)$/);
              const pName = match ? match[1].trim() : pStr;
              const pQty = match ? parseInt(match[2]) : 1;
              const target = freshProducts.find(p => p.title === pName);
              if (target) {
                const singlePrice = parseInt(target.originalPrice) || parseInt(target.specialPrice) || 0;
                calcOriginalPrice += singlePrice * pQty;
              }
            });
          }

          freshProducts.push({
            title: item['商品名稱'] || '',
            image: item['圖片檔名'] || '',
            youtube: item['影片網址'] || '',
            originalPrice: item['原價'] ? item['原價'] : (calcOriginalPrice > 0 ? calcOriginalPrice : ''),
            specialPrice: item['特價'] || '',
            status: item['狀態'] || '',
            category: item['分類'] || '套裝',
            packageDetail: detail,
            isPackage: true
          });
        });

        const freshData = { products: freshProducts, settings: data.settings };
        const freshDataStr = JSON.stringify(freshData);
        
        if (freshDataStr !== cachedData) {
          localStorage.setItem('fong_cache_v11', freshDataStr);
          products = freshProducts;
          siteSettings = data.settings || {};
          updateSettingsUI(siteSettings);
          document.getElementById('loading').style.display = 'none';
          
          loadSavedCart();
          renderCategories();
          renderProducts();
          updateCartUI();
        }
      } catch (error) {
        console.error('背景同步失敗:', error);
        if (!cachedData) document.getElementById('loading').innerText = '商品載入失敗，請檢查網路連線。';
      }
    }

    function updateSettingsUI(settings) {
      if (!settings) return;
      if (settings['公告內容']) {
        const annBox = document.getElementById('announcement-box');
        annBox.innerHTML = settings['公告內容']; annBox.style.display = 'block';
      }
      if (settings['LINE連結']) {
        document.getElementById('line-link-btn').href = settings['LINE連結'];
      }
      if (settings['主打商品'] && !hasShownAdThisLoad) {
        const targetTitles = settings['主打商品'].split(/[,，、]/).map(s => s.trim()).filter(s => s);
        const featuredProducts = [];
        targetTitles.forEach(title => {
          const index = products.findIndex(p => p.title === title);
          if (index !== -1) featuredProducts.push({ index, product: products[index] });
        });
        
        if (featuredProducts.length > 0) {
          const wrapper = document.getElementById('popup-items-wrapper');
          wrapper.innerHTML = featuredProducts.map(fp => {
            const p = fp.product;
            
            // 套裝結構：滿版展開清單
            if (p.isPackage && p.packageDetail) {
              const listItems = p.packageDetail.split(/[,，、]/).map(s => `• ${s.trim()}`).join('<br>');
              return `
                <div class="popup-card popup-pkg-card" onclick="handleAdClick('${p.title}')">
                  <div class="popup-pkg-header">
                    <span class="popup-pkg-title">🔥 ${p.title}</span>
                    <span class="popup-card-action">點擊選購 ➔</span>
                  </div>
                  <div class="popup-pkg-inner-box">
                    <div style="color:#ff9900; font-size:0.75rem; font-weight:bold; margin-bottom:3px;">📦 組合內含品項：</div>
                    ${listItems}
                  </div>
                  <div class="popup-pkg-bottom">
                    <span style="font-size:0.8rem; color:#aaa;">限時特惠套裝</span>
                    <span class="popup-card-price">特價 NT$${p.specialPrice}</span>
                  </div>
                </div>
              `;
            } 
            // 單品帶圖結構
            else if (p.image) {
              return `
                <div class="popup-card" onclick="handleAdClick('${p.title}')">
                  <img src="${p.image}" class="popup-card-thumb" alt="${p.title}">
                  <div class="popup-card-main">
                    <div class="popup-card-title">${p.title}</div>
                    <div class="popup-card-price">特價 NT$${p.specialPrice || p.originalPrice}</div>
                  </div>
                  <div class="popup-card-action">選購 ➔</div>
                </div>
              `;
            }
            // 單品純文字結構
            else {
              return `
                <div class="popup-card" onclick="handleAdClick('${p.title}')">
                  <div class="popup-card-main">
                    <div class="popup-card-title">${p.title}</div>
                    <div class="popup-card-price">特價 NT$${p.specialPrice || p.originalPrice}</div>
                  </div>
                  <div class="popup-card-action">選購 ➔</div>
                </div>
              `;
            }
          }).join('');
          
          document.getElementById('popup-overlay').style.display = 'flex';
          hasShownAdThisLoad = true;
        }
      }
    }

    function closePopup() { document.getElementById('popup-overlay').style.display = 'none'; }

    function handleAdClick(targetTitle) {
      closePopup(); 
      if (!targetTitle) return; 
      const targetIndex = products.findIndex(p => p.title === targetTitle);
      if (targetIndex !== -1) {
        const p = products[targetIndex];
        if (currentCategory !== '全部' && p.category !== currentCategory) setCategory(p.category); 
        setTimeout(() => {
          const cardBtn = document.getElementById(`btn-${targetIndex}`);
          if (cardBtn) {
            cardBtn.scrollIntoView({ behavior: 'smooth', block: 'center' });
            const cardElement = cardBtn.closest('.product-card');
            cardElement.style.boxShadow = '0 0 25px #ff4d4d';
            setTimeout(() => cardElement.style.boxShadow = '0 4px 10px rgba(0, 0, 0, 0.15)', 2000);
            if (!selectedItems[targetTitle]) toggleSelect(targetTitle, targetIndex);
          }
        }, 150);
      }
    }

    function renderCategories() {
      const nav = document.getElementById('category-nav');
      const uniqueCategories = ['全部', ...new Set(products.map(p => p.category))];
      nav.innerHTML = uniqueCategories.map(cat => 
        `<button class="cat-btn ${cat === currentCategory ? 'active' : ''}" onclick="setCategory('${cat}')">${cat}</button>`
      ).join('');
    }

    function setCategory(cat) { currentCategory = cat; renderCategories(); renderProducts(); }

    function openSingleProductDetail(productName) {
      const p = products.find(item => item.title === productName);
      if (!p) return;

      document.getElementById('detail-modal-title').innerText = p.title;
      
      const priceText = p.specialPrice ? `NT$${p.specialPrice}` : (p.originalPrice ? `NT$${p.originalPrice}` : '依現場為準');
      document.getElementById('detail-price').innerText = priceText;

      const mediaBox = document.getElementById('detail-media-box');
      const img = document.getElementById('detail-img');
      const iframe = document.getElementById('detail-iframe');
      const playBtn = document.getElementById('detail-play-btn');

      mediaBox.classList.remove('playing');

      if (p.image || p.youtube) {
        mediaBox.style.display = 'block';
        img.src = p.image || '';
        img.style.display = p.image ? 'block' : 'none';
        if (p.youtube) {
          iframe.src = getEmbedUrl(p.youtube);
          playBtn.style.display = 'flex';
        } else {
          iframe.src = '';
          playBtn.style.display = 'none';
        }
      } else {
        mediaBox.style.display = 'none';
        iframe.src = '';
      }

      document.getElementById('product-detail-modal').style.display = 'flex';
    }

    function closeDetailModal() {
      const mediaBox = document.getElementById('detail-media-box');
      const iframe = document.getElementById('detail-iframe');
      mediaBox.classList.remove('playing');
      iframe.src = '';
      document.getElementById('product-detail-modal').style.display = 'none';
    }

    function playDetailVideo() {
      const mediaBox = document.getElementById('detail-media-box');
      const iframe = document.getElementById('detail-iframe');
      if (!iframe.src) return;
      mediaBox.classList.add('playing');
      if (!iframe.src.includes('autoplay=1')) {
        iframe.src += (iframe.src.includes('?') ? '&' : '?') + 'autoplay=1';
      }
    }

    function renderProducts() {
      const container = document.getElementById('product-container');
      container.innerHTML = '';
      products.forEach((item, index) => {
        const statusStr = (item.status || '').toString().trim().toUpperCase();
        if (statusStr === 'N' || statusStr === '下架') return;
        if (currentCategory !== '全部' && item.category !== currentCategory) return;
        
        const memoryQty = selectedItems[item.title] || 1;
        const embedUrl = getEmbedUrl(item.youtube);
        const card = document.createElement('div');
        card.className = 'product-card'; card.id = `card-${index}`;

        let mediaBoxHtml = '';
        const hasMedia = item.image || item.youtube;
        if (hasMedia) {
          const imgSrc = item.image || 'https://via.placeholder.com/300x220?text=點擊播放影片';
          mediaBoxHtml = `
            <div class="media-container" id="media-${index}" onclick="playVideo(${index})">
              <img src="${imgSrc}" alt="${item.title}" onerror="this.src='https://via.placeholder.com/300x220?text=無圖片';">
              <div class="play-button" style="${item.youtube ? '' : 'display:none;'}"></div>
              ${item.youtube ? `<iframe id="iframe-${index}" src="${embedUrl}" title="${item.title}" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>` : ''}
            </div>
          `;
        }

        let packageBoxHtml = '';
        if (item.isPackage && item.packageDetail) {
          const parts = item.packageDetail.split(/[,，、]/).map(s => s.trim()).filter(s => s);
          const tagsHtml = parts.map(pStr => {
            const match = pStr.match(/^(.*?)\s*[*xX]\s*(\d+)$/);
            const pName = match ? match[1].trim() : pStr;
            const pQty = match ? match[2] : '1';
            return `
              <div class="package-item-tag" onclick="openSingleProductDetail('${pName}')">
                <span>• ${pName} <strong>x${pQty}</strong></span>
                <span class="view-badge">🔍 詳情</span>
              </div>
            `;
          }).join('');

          packageBoxHtml = `
            <div class="package-items-box">
              <div class="package-items-title">📦 套裝品項（點擊看詳情）：</div>
              ${tagsHtml}
            </div>
          `;
        }

        card.innerHTML = `
          ${mediaBoxHtml}
          <div class="card-info">
            <div>
              <div class="title">${item.title}</div>
              ${packageBoxHtml}
              <div class="price-group">
                ${item.originalPrice ? `售價 <span class="original-price">NT$${item.originalPrice}</span>` : ''}
                特價 <span class="special-price">NT$${item.specialPrice}</span>
              </div>
            </div>
            <div class="quantity-control">
              <div class="qty-btn" onclick="changeQty(${index}, -1)">-</div>
              <span class="qty-number" id="qty-${index}">${memoryQty}</span>
              <div class="qty-btn" onclick="changeQty(${index}, 1)">+</div>
            </div>
            <button class="add-cart-btn" id="btn-${index}" onclick="toggleSelect('${item.title}', ${index})">
              ＋ 加入購買清單
            </button>
          </div>
        `;
        container.appendChild(card);
      });
      syncCartButtons();
    }

    function syncCartButtons() {
      products.forEach((item, index) => {
        const btn = document.getElementById(`btn-${index}`);
        if (btn) {
          if (selectedItems[item.title]) {
            btn.innerText = '✓ 已加入清單'; btn.classList.add('selected');
            document.getElementById(`qty-${index}`).innerText = selectedItems[item.title];
          } else {
            btn.innerText = '＋ 加入購買清單'; btn.classList.remove('selected');
            document.getElementById(`qty-${index}`).innerText = 1;
          }
        }
      });
    }

    function playVideo(index) {
      const mediaBox = document.getElementById(`media-${index}`);
      const iframe = document.getElementById(`iframe-${index}`);
      if (!iframe) return;
      mediaBox.classList.add('playing');
      let currentSrc = iframe.src;
      if (!currentSrc.includes('autoplay=1')) { iframe.src = currentSrc + (currentSrc.includes('?') ? '&' : '?') + 'autoplay=1'; }
    }

    function changeQty(index, delta) {
      const qtySpan = document.getElementById(`qty-${index}`);
      let currentQty = parseInt(qtySpan.innerText);
      currentQty += delta;
      if (currentQty < 1) currentQty = 1;
      qtySpan.innerText = currentQty;
      const title = products[index].title;
      
      if (selectedItems[title]) {
        selectedItems[title] = currentQty;
        saveCart();
        updateCartUI();
        if (document.getElementById('cart-modal-overlay').style.display === 'flex') openCartModal();
      }
    }

    function toggleSelect(title, index) {
      const currentQty = parseInt(document.getElementById(`qty-${index}`).innerText);
      if (selectedItems[title]) {
        delete selectedItems[title];
      } else {
        selectedItems[title] = currentQty;
      }
      saveCart();
      syncCartButtons();
      updateCartUI();
    }

    function calculateCartTotal() {
      let total = 0;
      for (let title in selectedItems) {
        const qty = selectedItems[title];
        const product = products.find(p => p.title === title);
        let price = product ? (parseInt(product.specialPrice) || parseInt(product.originalPrice) || 0) : 0;
        total += price * qty;
      }
      return total;
    }

    function updateCartUI() {
      const count = Object.keys(selectedItems).length;
      const cartBtn = document.getElementById('floating-cart');
      const rewardBadge = document.getElementById('floating-left-reward');
      const totalPrice = calculateCartTotal();

      if (count > 0) {
        cartBtn.innerHTML = `🛒 已選取 <span id="cart-count">${count}</span> 項（NT$${totalPrice}）`;
        cartBtn.style.display = 'block';
      } else {
        cartBtn.style.display = 'none';
      }

      const threshold = parseInt(siteSettings['滿額門檻']) || 0;
      const giftName = siteSettings['滿額贈品'] || '';

      if (count > 0 && threshold > 0 && giftName) {
        rewardBadge.style.display = 'flex';
        const percent = Math.min(100, Math.floor((totalPrice / threshold) * 100));
        document.getElementById('floating-reward-bar').style.height = percent + '%';
        
        if (totalPrice >= threshold) {
          document.getElementById('floating-reward-text').innerHTML = `<span style="color:#28a745; font-weight:bold;">已達標</span>`;
        } else {
          document.getElementById('floating-reward-text').innerHTML = `差$${threshold - totalPrice}`;
        }
      } else {
        rewardBadge.style.display = 'none';
      }
    }

    function openCartModal() {
      goToCartStep1();
      renderCartItems();
      document.getElementById('cart-modal-overlay').style.display = 'flex';
    }

    function closeCartModal() { document.getElementById('cart-modal-overlay').style.display = 'none'; }

    function goToCartStep1() {
      document.getElementById('cart-step-1').style.display = 'block';
      document.getElementById('cart-step-2').style.display = 'none';
      renderCartItems();
    }

    function goToCartStep2() {
      if (Object.keys(selectedItems).length === 0) return;
      const totalPrice = calculateCartTotal();
      document.getElementById('cart-step2-total').innerText = `NT$${totalPrice}`;
      document.getElementById('cart-step-1').style.display = 'none';
      document.getElementById('cart-step-2').style.display = 'block';
    }

    function renderCartItems() {
      const container = document.getElementById('cart-items-container');
      container.innerHTML = '';
      let totalPrice = 0;
      if (Object.keys(selectedItems).length === 0) return;

      for (let title in selectedItems) {
        const qty = selectedItems[title];
        const product = products.find(p => p.title === title);
        let price = product ? (parseInt(product.specialPrice) || parseInt(product.originalPrice) || 0) : 0;
        totalPrice += price * qty;
        
        const detailHtml = product && product.packageDetail ? `<div class="cart-item-desc">內含：${product.packageDetail}</div>` : '';

        container.innerHTML += `
          <div class="cart-item">
            <div class="cart-item-info">
              <div class="cart-item-title">${title}</div>
              ${detailHtml}
              <div class="cart-item-price">單價 NT$${price}</div>
            </div>
            <div class="cart-item-actions">
              <div class="quantity-control" style="margin-bottom: 0;">
                <div class="qty-btn" style="width:28px; height:28px; font-size:1.2rem;" onclick="updateCartItemQty('${title}', -1)">-</div>
                <span class="qty-number" style="font-size:1.1rem; min-width:20px;">${qty}</span>
                <div class="qty-btn" style="width:28px; height:28px; font-size:1.2rem;" onclick="updateCartItemQty('${title}', 1)">+</div>
              </div>
              <button class="cart-del-btn" onclick="removeCartItem('${title}')">✖</button>
            </div>
          </div>
        `;
      }

      document.getElementById('cart-total-price').innerText = `NT$${totalPrice}`;

      const threshold = parseInt(siteSettings['滿額門檻']) || 0;
      const giftName = siteSettings['滿額贈品'] || '';
      const rewardHint = document.getElementById('cart-reward-hint');
      if (threshold && giftName) {
        if (totalPrice >= threshold) {
          rewardHint.innerHTML = `🎉 已達滿額門檻！訂單將加贈：<strong>${giftName}</strong>`;
        } else {
          rewardHint.innerHTML = `💡 還差 NT$${threshold - totalPrice} 即贈送「${giftName}」！`;
        }
      } else {
        rewardHint.innerHTML = '';
      }
    }

    function updateCartItemQty(title, delta) {
      let currentQty = selectedItems[title];
      currentQty += delta;
      if (currentQty < 1) currentQty = 1; 
      selectedItems[title] = currentQty;
      saveCart();
      syncCartButtons();
      updateCartUI();
      renderCartItems();   
    }

    function removeCartItem(title) {
      delete selectedItems[title];
      saveCart();
      updateCartUI();
      syncCartButtons();
      if (Object.keys(selectedItems).length === 0) {
        closeCartModal();
      } else {
        renderCartItems();
      }
    }

    function confirmSendToLine() {
      if (Object.keys(selectedItems).length === 0) return;
      
      const custName = document.getElementById('order-customer-name').value.trim();
      const custNote = document.getElementById('order-customer-note').value.trim();
      const totalPrice = calculateCartTotal();
      const threshold = parseInt(siteSettings['滿額門檻']) || 0;
      const giftName = siteSettings['滿額贈品'] || '';

      let message = "你好！我想預訂以下煙火商品：\n------------------------\n";
      
      for (let title in selectedItems) { 
        const qty = selectedItems[title];
        const product = products.find(p => p.title === title);
        let price = product ? (parseInt(product.specialPrice) || parseInt(product.originalPrice) || 0) : 0;
        message += `• ${title} x ${qty} (小計 NT$${price * qty})\n`; 
      }
      
      message += "------------------------\n";
      message += `💰 預估總金額：NT$${totalPrice}\n`;

      if (threshold && totalPrice >= threshold && giftName) {
        message += `🎁 滿額贈品：${giftName}\n`;
      }

      if (custName) {
        message += `👤 訂購人稱呼：${custName}\n`;
      }
      if (custNote) {
        message += `📝 備註說明：${custNote}\n`;
      }

      message += "\n請問目前都有現貨嗎？";
      
      const lineUrl = `https://line.me/R/msg/text/?${encodeURIComponent(message)}`;
      window.location.href = lineUrl;
    }

    window.addEventListener('scroll', () => {
      const scrollBtn = document.getElementById('scroll-top-btn');
      if (window.scrollY > 200) {
        scrollBtn.style.opacity = '1';
        scrollBtn.style.pointerEvents = 'auto';
      } else {
        scrollBtn.style.opacity = '0';
        scrollBtn.style.pointerEvents = 'none';
      }
    });

    loadProducts();
  </script>
</body>
</html>
