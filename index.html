<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FONG 煙火精選目錄</title>

  <meta property="og:title" content="FONG 煙火精選商品目錄">
  <meta property="og:description" content="提供最新煙火款式、價格及現場施放影片展示，歡迎選購！">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://fong-shop.github.io/Fong/">
  <meta property="og:image" content="https://fong-shop.github.io/Fong/messageImage_1785794548467.jpg">

  <style>
    * { box-sizing: border-box; }
    body {
      font-family: Arial, sans-serif;
      background-color: #f4f4f4;
      margin: 0;
      padding: 20px 20px 80px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* 分類導覽列樣式 */
    .category-nav {
      display: flex;
      gap: 12px;
      margin-bottom: 25px;
      overflow-x: auto;
      padding-bottom: 5px;
      max-width: 1000px;
      width: 100%;
      /* 隱藏捲軸但可滑動 */
      scrollbar-width: none; 
    }
    .category-nav::-webkit-scrollbar {
      display: none; 
    }

    .cat-btn {
      padding: 10px 20px;
      background-color: #333;
      color: #fff;
      border: 1px solid #555;
      border-radius: 25px;
      cursor: pointer;
      font-size: 1rem;
      white-space: nowrap;
      transition: all 0.2s;
    }

    .cat-btn:hover {
      background-color: #444;
    }

    .cat-btn.active {
      background-color: #ff4d4d;
      border-color: #ff4d4d;
      font-weight: bold;
    }

    /* 商品列表容器 */
    .container {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 20px;
      max-width: 1000px;
      width: 100%;
    }

    .product-card {
      background-color: #000;
      color: #fff;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.15);
      border: 2px solid #000;
      display: flex;
      flex-direction: column;
    }

    .media-container {
      position: relative;
      width: 100%;
      height: 220px;
      cursor: pointer;
      background-color: #222;
    }

    .media-container img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      position: absolute;
      top: 0;
      left: 0;
      z-index: 10;
      transition: opacity 0.3s;
    }

    .play-button {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 50px;
      height: 50px;
      background-color: rgba(0, 0, 0, 0.7);
      border-radius: 50%;
      border: 2px solid #fff;
      z-index: 20;
      display: flex;
      justify-content: center;
      align-items: center;
      transition: all 0.2s;
    }

    .play-button::after {
      content: '';
      display: block;
      width: 0;
      height: 0;
      border-style: solid;
      border-width: 10px 0 10px 18px;
      border-color: transparent transparent transparent #fff;
      margin-left: 4px;
    }

    .media-container:hover .play-button {
      transform: translate(-50%, -50%) scale(1.1);
      background-color: rgba(255, 0, 0, 0.85);
    }

    .media-container iframe {
      width: 100%;
      height: 100%;
      border: none;
      position: absolute;
      top: 0;
      left: 0;
      z-index: 5;
    }

    .media-container.playing img,
    .media-container.playing .play-button {
      opacity: 0;
      pointer-events: none;
    }

    .card-info {
      padding: 15px;
      text-align: center;
      display: flex;
      flex-direction: column;
      flex-grow: 1;
      justify-content: space-between;
    }

    .title {
      font-size: 1.1rem;
      font-weight: bold;
      margin-bottom: 8px;
    }

    .price-group {
      font-size: 0.95rem;
      margin-bottom: 12px;
    }

    .original-price {
      text-decoration: line-through;
      color: #aaa;
      margin-right: 8px;
    }

    .special-price {
      color: #ff4d4d;
      font-weight: bold;
      font-size: 1.1rem;
    }

    .quantity-control {
      display: flex;
      justify-content: center;
      align-items: center;
      margin-bottom: 10px;
      gap: 12px;
    }

    .qty-btn {
      background-color: #333;
      color: #fff;
      border: 1px solid #555;
      width: 32px;
      height: 32px;
      border-radius: 6px;
      font-size: 1.2rem;
      font-weight: bold;
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      user-select: none;
    }

    .qty-btn:active {
      background-color: #555;
    }

    .qty-number {
      font-size: 1.1rem;
      font-weight: bold;
      min-width: 24px;
    }

    .add-cart-btn {
      width: 100%;
      padding: 10px;
      background-color: #333;
      color: #fff;
      border: 1px solid #555;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.95rem;
      font-weight: bold;
      transition: all 0.2s;
    }

    .add-cart-btn:hover {
      background-color: #444;
    }

    .add-cart-btn.selected {
      background-color: #28a745;
      color: #fff;
      border-color: #28a745;
    }

    .floating-cart {
      position: fixed;
      bottom: 20px;
      right: 20px;
      background-color: #06C755;
      color: #fff;
      padding: 14px 24px;
      border-radius: 50px;
      cursor: pointer;
      font-size: 1rem;
      font-weight: bold;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
      display: none;
      z-index: 1000;
      transition: transform 0.2s;
    }

    .floating-cart:hover {
      transform: scale(1.05);
    }

    #loading {
      text-align: center;
      font-size: 1.2rem;
      color: #666;
      padding: 50px;
      width: 100%;
    }
  </style>
</head>
<body>

  <div id="loading">載入商品目錄中...</div>
  
  <!-- 分類按鈕容器 -->
  <div class="category-nav" id="category-nav"></div> 

  <!-- 產品卡片容器 -->
  <div class="container" id="product-container"></div>

  <div class="floating-cart" id="floating-cart" onclick="sendToLine()">
    🛒 已選取 <span id="cart-count">0</span> 項（點此傳送至 LINE 訂購）
  </div>

  <script>
    const GAS_API_URL = "https://script.google.com/macros/s/AKfycbzdvebTnsOSgEURWczwLjLuQPIz9tbHWKSpEIgsT38V5jR7vzHUHbFiPGtH5F0rQJEZWA/exec";

    let products = [];
    const selectedItems = {};
    let currentCategory = '全部'; // 預設顯示全部

    // 處理 YouTube 影片網址
    function getEmbedUrl(url) {
      if (!url) return '';
      let videoId = '';
      if (url.includes('v=')) {
        videoId = url.split('v=')[1].split('&')[0];
      } else if (url.includes('youtu.be/')) {
        videoId = url.split('youtu.be/')[1].split('?')[0];
      }
      return `https://www.youtube.com/embed/${videoId}?enablejsapi=1`;
    }

    // 載入商品資料（含 SWR 快取機制）
    async function loadProducts() {
      // 步驟 1：嘗試從 localStorage 讀取快取（極速秒開）
      const cachedData = localStorage.getItem('fong_products_cache');
      if (cachedData) {
        try {
          products = JSON.parse(cachedData);
          document.getElementById('loading').style.display = 'none';
          renderCategories();
          renderProducts();
        } catch (e) {
          console.error('快取解析失敗', e);
        }
      }

      // 步驟 2：背景發送 API 請求最新資料
      try {
        const cacheBuster = (GAS_API_URL.includes('?') ? '&' : '?') + 't=' + new Date().getTime();
        const response = await fetch(GAS_API_URL + cacheBuster, { cache: 'no-store' });
        const data = await response.json();
        
        const freshProducts = [];
        data.forEach(item => {
          if (!item['商品名稱']) return;
          freshProducts.push({
            title: item['商品名稱'] || '',
            image: item['圖片檔名'] || '',
            youtube: item['影片網址'] || '',
            originalPrice: item['原價'] || '',
            specialPrice: item['特價'] || '',
            status: item['狀態'] || '',
            category: item['分類'] || '其他' // 讀取分類欄位，空白則預設為"其他"
          });
        });

        // 比對資料是否有變更
        const freshDataStr = JSON.stringify(freshProducts);
        if (freshDataStr !== cachedData) {
          localStorage.setItem('fong_products_cache', freshDataStr);
          products = freshProducts;
          document.getElementById('loading').style.display = 'none';
          renderCategories();
          renderProducts();
        }
      } catch (error) {
        console.error('背景同步失敗:', error);
        if (!cachedData) {
          document.getElementById('loading').innerText = '商品載入失敗，請檢查網路連線。';
        }
      }
    }

    // 渲染分類導覽列
    function renderCategories() {
      const nav = document.getElementById('category-nav');
      
      // 篩選出不重複的分類名稱，並加上「全部」
      const uniqueCategories = ['全部', ...new Set(products.map(p => p.category))];

      nav.innerHTML = uniqueCategories.map(cat => 
        `<button class="cat-btn ${cat === currentCategory ? 'active' : ''}" onclick="setCategory('${cat}')">${cat}</button>`
      ).join('');
    }

    // 點擊分類按鈕
    function setCategory(cat) {
      currentCategory = cat;
      renderCategories(); // 更新按鈕樣式
      renderProducts();   // 重新渲染商品
    }

    // 渲染商品卡片
    function renderProducts() {
      const container = document.getElementById('product-container');
      container.innerHTML = '';

      products.forEach((item, index) => {
        // 狀態為 N 或 下架 則不顯示
        const statusStr = (item.status || '').toString().trim().toUpperCase();
        if (statusStr === 'N' || statusStr === '下架') {
          return;
        }

        // 分類過濾
        if (currentCategory !== '全部' && item.category !== currentCategory) {
          return;
        }

        const embedUrl = getEmbedUrl(item.youtube);
        const card = document.createElement('div');
        card.className = 'product-card';
        
        card.innerHTML = `
          <div class="media-container" id="media-${index}" onclick="playVideo(${index})">
            <img src="${item.image}" alt="${item.title}" onerror="this.src='https://via.placeholder.com/300x220?text=無圖片';">
            <div class="play-button"></div>
            <iframe id="iframe-${index}" src="${embedUrl}" title="${item.title}" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
          </div>
          <div class="card-info">
            <div>
              <div class="title">${item.title}</div>
              <div class="price-group">
                售價 <span class="original-price">NT$${item.originalPrice}</span>
                特價 <span class="special-price">NT$${item.specialPrice}</span>
              </div>
            </div>

            <div class="quantity-control">
              <div class="qty-btn" onclick="changeQty(${index}, -1)">-</div>
              <span class="qty-number" id="qty-${index}">1</span>
              <div class="qty-btn" onclick="changeQty(${index}, 1)">+</div>
            </div>

            <button class="add-cart-btn" id="btn-${index}" onclick="toggleSelect('${item.title}', ${index})">
              ＋ 加入購買清單
            </button>
          </div>
        `;
        container.appendChild(card);
      });
      
      // 確保切換分類後，購物車已選取的按鈕狀態是正確的
      syncCartButtons();
    }

    // 同步按鈕狀態（切換分類重新渲染後，保留已加入購物車的按鈕樣式）
    function syncCartButtons() {
      products.forEach((item, index) => {
        const btn = document.getElementById(`btn-${index}`);
        if (btn) {
          if (selectedItems[item.title]) {
            btn.innerText = '✓ 已加入清單';
            btn.classList.add('selected');
            // 同步數量
            document.getElementById(`qty-${index}`).innerText = selectedItems[item.title];
          } else {
            btn.innerText = '＋ 加入購買清單';
            btn.classList.remove('selected');
            document.getElementById(`qty-${index}`).innerText = 1;
          }
        }
      });
    }

    // 播放影片（自動關閉其他影片）
    function playVideo(index) {
      products.forEach((_, i) => {
        if (i !== index) {
          const otherMediaBox = document.getElementById(`media-${i}`);
          const otherIframe = document.getElementById(`iframe-${i}`);
          if (otherMediaBox && otherMediaBox.classList.contains('playing')) {
            otherMediaBox.classList.remove('playing');
            otherIframe.src = otherIframe.src.replace('&autoplay=1', '').replace('?autoplay=1', '');
          }
        }
      });

      const mediaBox = document.getElementById(`media-${index}`);
      const iframe = document.getElementById(`iframe-${index}`);
      mediaBox.classList.add('playing');
      let currentSrc = iframe.src;
      if (!currentSrc.includes('autoplay=1')) {
        iframe.src = currentSrc + (currentSrc.includes('?') ? '&' : '?') + 'autoplay=1';
      }
    }

    // 增減數量
    function changeQty(index, delta) {
      const qtySpan = document.getElementById(`qty-${index}`);
      let currentQty = parseInt(qtySpan.innerText);
      currentQty += delta;
      if (currentQty < 1) currentQty = 1;
      qtySpan.innerText = currentQty;

      const title = products[index].title;
      // 如果已經加入購物車，同步更新裡面的數量
      if (selectedItems[title]) {
        selectedItems[title] = currentQty;
      }
    }

    // 加入/取消 購買清單
    function toggleSelect(title, index) {
      const btn = document.getElementById(`btn-${index}`);
      const currentQty = parseInt(document.getElementById(`qty-${index}`).innerText);
      
      if (selectedItems[title]) {
        delete selectedItems[title];
        btn.innerText = '＋ 加入購買清單';
        btn.classList.remove('selected');
      } else {
        selectedItems[title] = currentQty;
        btn.innerText = '✓ 已加入清單';
        btn.classList.add('selected');
      }
      
      updateCartUI();
    }

    // 更新浮動購物車介面
    function updateCartUI() {
      const count = Object.keys(selectedItems).length;
      const cartBtn = document.getElementById('floating-cart');
      const countSpan = document.getElementById('cart-count');

      countSpan.innerText = count;
      cartBtn.style.display = count > 0 ? 'block' : 'none';
    }

    // 傳送訂單至 LINE
    function sendToLine() {
      if (Object.keys(selectedItems).length === 0) return;

      let message = "你好！我想購買以下煙火商品：\n------------------------\n";
      for (let title in selectedItems) {
        message += `• ${title} x ${selectedItems[title]}\n`;
      }
      message += "------------------------\n請問目前都有現貨嗎？";

      const lineUrl = `https://line.me/R/msg/text/?${encodeURIComponent(message)}`;
      window.location.href = lineUrl;
    }

    // 初始化啟動
    loadProducts();
  </script>

</body>
</html>
