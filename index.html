<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>商品目錄</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background-color: #f5f5f5; font-family: sans-serif; padding: 20px; }
    
    .product-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 20px;
      max-width: 1000px;
      margin: 0 auto;
    }

    .product-card {
      border: 2px solid #000;
      border-radius: 12px;
      overflow: hidden;
      background: #fff;
      display: flex;
      flex-direction: column;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
    }

    .product-card img {
      width: 100%;
      height: 220px;
      object-fit: contain;
      padding: 10px;
    }

    .card-info {
      background-color: #000;
      color: #fff;
      padding: 15px;
      text-align: center;
      margin-top: auto;
    }

    .title {
      font-size: 1.1rem;
      font-weight: bold;
      margin-bottom: 10px;
    }

    .price-group {
      display: flex;
      justify-content: center;
      gap: 15px;
      font-size: 0.95rem;
    }

    .original-price {
      text-decoration: line-through;
      color: #aaa;
    }

    .special-price {
      color: #ff4d4d;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <div class="product-grid">
    <!-- 商品 1 -->
    <div class="product-card">
      <img src="https://via.placeholder.com/300x200?text=Apple" alt="蘋果小高空">
      <div class="card-info">
        <div class="title">蘋果小高空(大花)</div>
        <div class="price-group">
          <span>售價 <span class="original-price">NT$150</span></span>
          <span>特價 <span class="special-price">NT$50</span></span>
        </div>
      </div>
    </div>

    <!-- 商品 2 -->
    <div class="product-card">
      <img src="https://via.placeholder.com/300x200?text=Bubble" alt="雙泡泡小高空">
      <div class="card-info">
        <div class="title">雙泡泡小高空(雙花)</div>
        <div class="price-group">
          <span>售價 <span class="original-price">NT$150</span></span>
          <span>特價 <span class="special-price">NT$50</span></span>
        </div>
      </div>
    </div>
  </div>

</body>
</html>
