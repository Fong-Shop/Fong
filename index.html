<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FONG 煙火精選目錄</title>

  <meta property="og:title" content="FONG 煙火精選商品目錄">
  <meta property="og:description" content="提供最新煙火款式、價格及現場施放影片展示，歡迎選購！">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://fong-shop.github.io/Fong/">
  <meta property="og:image" content="https://fong-shop.github.io/Fong/messageImage_1785794548467.jpg">

  <style>
    * { box-sizing: border-box; }
    body {
      font-family: Arial, sans-serif; background-color: #f4f4f4;
      margin: 0; padding: 20px 20px 80px 20px;
      display: flex; flex-direction: column; align-items: center;
    }
    .announcement {
      width: 100%; max-width: 1000px; background-color: #fff3cd; 
      color: #856404; padding: 12px 20px; border-radius: 8px;
      margin-bottom: 20px; border-left: 5px solid #ffc107;
      font-size: 0.95rem; line-height: 1.5;
      box-shadow: 0 2px 5px rgba(0,0,0,0.05); display: none; 
    }
    .category-nav {
      display: flex; gap: 12px; margin-bottom: 25px; overflow-x: auto;
      padding-bottom: 5px; max-width: 1000px; width: 100%; scrollbar-width: none; 
    }
    .category-nav::-webkit-scrollbar { display: none; }
    .cat-btn {
      padding: 10px 20px; background-color: #333; color: #fff;
      border: 1px solid #555; border-radius: 25px; cursor: pointer;
      font-size: 1rem; white-space: nowrap; transition: all 0.2s;
    }
    .cat-btn:hover { background-color: #444; }
    .cat-btn.active { background-color: #ff4d4d; border-color: #ff4d4d; font-weight: bold; }

    .container {
      display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 20px; max-width: 1000px; width: 100%;
    }
    .product-card {
      background-color: #000; color: #fff; border-radius: 12px; overflow: hidden;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.15); border: 2px solid #000;
      display: flex; flex-direction: column; transition: box-shadow 0.3s ease;
    }
    .media-container { position: relative; width: 100%; height: 220px; cursor: pointer; background-color: #222; }
    .media-container img {
      width: 100%; height: 100%; object-fit: cover; position: absolute;
      top: 0; left: 0; z-index: 10; transition: opacity 0.3s;
    }
    .play-button {
      position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
      width: 50px; height: 50px; background-color: rgba(0, 0, 0, 0.7);
      border-radius: 50%; border: 2px solid #fff; z-index: 20;
      display: flex; justify-content: center; align-items: center; transition: all 0.2s;
    }
    .play-button::after {
      content: ''; display: block; width: 0; height: 0;
      border-style: solid; border-width: 10px 0 10px 18px;
      border-color: transparent transparent transparent #fff; margin-left: 4px;
    }
    .media-container:hover .play-button { transform: translate(-50%, -50%) scale(1.1); background-color: rgba(255, 0, 0, 0.85); }
    .media-container iframe { width: 100%; height: 100%; border: none; position: absolute; top: 0; left: 0; z-index: 5; }
    .media-container.playing img, .media-container.playing .play-button { opacity: 0; pointer-events: none; }

    .card-info { padding: 15px; text-align: center; display: flex; flex-direction: column; flex-grow: 1; justify-content: space-between; }
    .title { font-size: 1.1rem; font-weight: bold; margin-bottom: 8px; }
    .price-group { font-size: 0.95rem; margin-bottom: 12px; }
    .original-price { text-decoration: line-through; color: #aaa; margin-right: 8px; }
    .special-price { color: #ff4d4d; font-weight: bold; font-size: 1.1rem; }
    .quantity-control { display: flex; justify-content: center; align-items: center; margin-bottom: 10px; gap: 12px; }
    .qty-btn {
      background-color: #333; color: #fff; border: 1px solid #555;
      width: 32px; height: 32px; border-radius: 6px; font-size: 1.2rem;
      font-weight: bold; cursor: pointer; display: flex; justify-content: center; align-items: center; user-select: none;
    }
    .qty-btn:active { background-color: #555; }
    .qty-number { font-size: 1.1rem; font-weight: bold; min-width: 24px; }
    .add-cart-btn {
      width: 100%; padding: 10px; background-color: #333; color: #fff;
      border: 1px solid #555; border-radius: 6px; cursor: pointer;
      font-size: 0.95rem; font-weight: bold; transition: all 0.2s;
    }
    .add-cart-btn:hover { background-color: #444; }
    .add-cart-btn.selected { background-color: #28a745; color: #fff; border-color: #28a745; }

    .floating-cart {
      position: fixed; bottom: 20px; right: 20px; background-color: #06C755;
      color: #fff; padding: 14px 24px; border-radius: 50px; cursor: pointer;
      font-size: 1rem; font-weight: bold; box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
      display: none; z-index: 1000; transition: transform 0.2s;
    }
    .floating-cart:hover { transform: scale(1.05); }

    .floating-tools {
      position: fixed; bottom: 80px; right: 20px; display: flex; flex-direction: column;
      gap: 12px; z-index: 999; opacity: 0; pointer-events: none; transition: opacity 0.3s;
    }
    .tool-btn {
      width: 45px; height: 45px; border-radius: 50%; background-color: #333;
      color: #fff; display: flex; justify-content: center; align-items: center;
      cursor: pointer; box-shadow: 0 4px 10px rgba(0,0,0,0.3); transition: all 0.2s;
      text-decoration: none; font-size: 1.2rem;
    }
    .tool-btn:hover { transform: scale(1.1); }
    .tool-btn.line-btn { background-color: #00c300; font-size: 1.5rem; }

    #loading { text-align: center; font-size: 1.2rem; color: #666; padding: 50px; width: 100%; }

    /* 🎁 動態多格彈出廣告視窗樣式 */
    .popup-overlay {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background-color: rgba(0, 0, 0, 0.8); z-index: 2000; display: none; 
      justify-content: center; align-items: center; padding: 20px; backdrop-filter: blur(3px);
    }
    .popup-content {
      position: relative; max-width: 600px; width: 100%;
      background: #1a1a1a; border-radius: 12px; border: 2px solid #ff4d4d;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5); padding: 25px 20px;
      animation: popIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; text-align: center;
    }
    @keyframes popIn { 0% { transform: scale(0.8); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
    .popup-close {
      position: absolute; top: -15px; right: -15px; width: 36px; height: 36px; 
      background-color: #fff; color: #000; border-radius: 50%; display: flex; 
      justify-content: center; align-items: center; font-size: 1.2rem; font-weight: bold; 
      cursor: pointer; box-shadow: 0 2px 8px rgba(0,0,0,0.3); z-index: 2010; transition: transform 0.2s;
    }
    .popup-close:hover { transform: scale(1.15) rotate(90deg); }
    .popup-title { font-size: 1.4rem; font-weight: bold; color: #ffcc00; margin-bottom: 20px; }
    .popup-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 15px; }
    .popup-item {
      background: #000; border-radius: 8px; padding: 10px; cursor: pointer;
      border: 2px solid transparent; transition: all 0.2s;
    }
    .popup-item:hover { border-color: #ff4d4d; transform: scale(1.05); }
    .popup-item img { width: 100%; aspect-ratio: 4/3; object-fit: cover; border-radius: 6px; }
    .popup-item-title { color: #fff; font-size: 0.95rem; font-weight: bold; margin-top: 8px; }

    /* 🛒 購物車確認視窗樣式 */
    .cart-modal-content {
      position: relative; max-width: 500px; width: 100%;
      background: #1a1a1a; border-radius: 12px; border: 2px solid #06C755;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5); padding: 25px 20px;
      animation: popIn 0.3s ease forwards; text-align: left;
      color: #fff; max-height: 85vh; display: flex; flex-direction: column;
    }
    .cart-items-container { overflow-y: auto; max-height: 50vh; margin-bottom: 15px; padding-right: 5px; }
    .cart-items-container::-webkit-scrollbar { width: 6px; }
    .cart-items-container::-webkit-scrollbar-thumb { background: #555; border-radius: 3px; }
    .cart-item {
      display: flex; justify-content: space-between; align-items: center;
      padding: 12px 0; border-bottom: 1px solid #333;
    }
    .cart-item-info { flex-grow: 1; padding-right: 10px; }
    .cart-item-title { font-weight: bold; font-size: 1.05rem; margin-bottom: 5px; }
    .cart-item-price { color: #ff4d4d; font-size: 0.95rem; }
    .cart-item-actions { display: flex; align-items: center; gap: 12px; }
    .cart-del-btn {
      background-color: #ff4d4d; color: white; border: none; border-radius: 6px;
      width: 30px; height: 30px; font-weight: bold; cursor: pointer; transition: 0.2s;
    }
    .cart-del-btn:hover { background-color: #cc0000; }
    .cart-total {
      text-align: right; font-size: 1.4rem; font-weight: bold; color: #ffcc00;
      padding-top: 15px; border-top: 2px solid #444; margin-bottom: 15px;
    }
  </style>
</head>
<body>

  <div class="popup-overlay" id="popup-overlay">
    <div class="popup-content">
      <div class="popup-close" onclick="closePopup()">✖</div>
      <div class="popup-title">🔥 優惠主打推薦</div>
      <div class="popup-grid" id="popup-grid"></div>
    </div>
  </div>

  <div class="popup-overlay" id="cart-modal-overlay">
    <div class="cart-modal-content">
      <div class="popup-close" onclick="closeCartModal()">✖</div>
      <div class="popup-title" style="color: #06C755; margin-bottom: 10px;">🛒 購物車清單確認</div>
      <div class="cart-items-container" id="cart-items-container"></div>
      <div class="cart-total">總金額：<span id="cart-total-price">NT$0</span></div>
      <button class="add-cart-btn selected" style="font-size: 1.1rem; padding: 15px; background-color: #06C755; border:none;" onclick="confirmSendToLine()">
        ✅ 確認無誤，傳送至 LINE
      </button>
    </div>
  </div>

  <div id="loading">載入商品目錄中...</div>

  <div class="announcement" id="announcement-box"></div>
  <div class="category-nav" id="category-nav"></div> 
  <div class="container" id="product-container"></div>

  <div class="floating-cart" id="floating-cart" onclick="openCartModal()">
    🛒 已選取 <span id="cart-count">0</span> 項（點此查看清單）
  </div>

  <div class="floating-tools" id="floating-tools">
    <a href="#" target="_blank" class="tool-btn line-btn" id="line-link-btn" title="加 LINE 好友">💬</a>
    <div class="tool-btn" onclick="window.scrollTo({top: 0, behavior: 'smooth'})" title="回到頂部">⬆️</div>
  </div>

  <script>
    const GAS_API_URL = "https://script.google.com/macros/s/AKfycbzdvebTnsOSgEURWczwLjLuQPIz9tbHWKSpEIgsT38V5jR7vzHUHbFiPGtH5F0rQJEZWA/exec";

    let products = [];
    const selectedItems = {}; 
    let currentCategory = '全部'; 
    let hasShownAdThisLoad = false; 
    let lineProfileUrl = ''; // 全域變數：儲存後台設定的 LINE 連結

    function getEmbedUrl(url) {
      if (!url) return '';
      let videoId = '';
      if (url.includes('v=')) { videoId = url.split('v=')[1].split('&')[0]; } 
      else if (url.includes('youtu.be/')) { videoId = url.split('youtu.be/')[1].split('?')[0]; }
      return `https://www.youtube.com/embed/${videoId}?enablejsapi=1`;
    }

    // 💾 讀取記憶中的購物車
    function loadSavedCart() {
      const savedCart = localStorage.getItem('fong_shopping_cart');
      if (savedCart) {
        try {
          const parsed = JSON.parse(savedCart);
          Object.assign(selectedItems, parsed);
        } catch (e) { console.error('購物車讀取失敗'); }
      }
    }

    // 💾 儲存購物車狀態
    function saveCart() {
      localStorage.setItem('fong_shopping_cart', JSON.stringify(selectedItems));
    }

    async function loadProducts() {
      const cachedData = localStorage.getItem('fong_cache_v3');
      if (cachedData) {
        try {
          const parsed = JSON.parse(cachedData);
          products = parsed.products;
          updateSettingsUI(parsed.settings);
          document.getElementById('loading').style.display = 'none';
          
          loadSavedCart(); // 讀取記憶購物車
          renderCategories();
          renderProducts();
          updateCartUI();
        } catch (e) { console.error('快取解析失敗', e); }
      }

      try {
        const cacheBuster = (GAS_API_URL.includes('?') ? '&' : '?') + 't=' + new Date().getTime();
        const response = await fetch(GAS_API_URL + cacheBuster, { cache: 'no-store' });
        const data = await response.json(); 
        
        const freshProducts = [];
        data.products.forEach(item => {
          if (!item['商品名稱']) return;
          freshProducts.push({
            title: item['商品名稱'] || '', image: item['圖片檔名'] || '',
            youtube: item['影片網址'] || '', originalPrice: item['原價'] || '',
            specialPrice: item['特價'] || '', status: item['狀態'] || '', category: item['分類'] || '其他' 
          });
        });

        const freshData = { products: freshProducts, settings: data.settings };
        const freshDataStr = JSON.stringify(freshData);
        
        if (freshDataStr !== cachedData) {
          localStorage.setItem('fong_cache_v3', freshDataStr);
          products = freshProducts;
          updateSettingsUI(data.settings);
          document.getElementById('loading').style.display = 'none';
          
          loadSavedCart(); // 讀取記憶購物車
          renderCategories();
          renderProducts();
          updateCartUI();
        }
      } catch (error) {
        console.error('背景同步失敗:', error);
        if (!cachedData) document.getElementById('loading').innerText = '商品載入失敗，請檢查網路連線。';
      }
    }

    function updateSettingsUI(settings) {
      if (!settings) return;
      if (settings['公告內容']) {
        const annBox = document.getElementById('announcement-box');
        annBox.innerHTML = settings['公告內容']; annBox.style.display = 'block';
      }
      if (settings['LINE連結']) {
        lineProfileUrl = settings['LINE連結'];
        document.getElementById('line-link-btn').href = lineProfileUrl;
      }
      if (settings['主打商品'] && !hasShownAdThisLoad) {
        const targetTitles = settings['主打商品'].split(/[,，、]/).map(s => s.trim()).filter(s => s);
        const featuredProducts = [];
        targetTitles.forEach(title => {
          const index = products.findIndex(p => p.title === title);
          if (index !== -1) featuredProducts.push({ index, product: products[index] });
        });
        if (featuredProducts.length > 0) {
          const popupGrid = document.getElementById('popup-grid');
          popupGrid.innerHTML = featuredProducts.map(fp => `
            <div class="popup-item" onclick="handleAdClick('${fp.product.title}')">
              <img src="${fp.product.image}" alt="${fp.product.title}" onerror="this.src='https://via.placeholder.com/150?text=無圖片';">
              <div class="popup-item-title">${fp.product.title}</div>
            </div>
          `).join('');
          document.getElementById('popup-overlay').style.display = 'flex';
          hasShownAdThisLoad = true;
        }
      }
    }

    function closePopup() { document.getElementById('popup-overlay').style.display = 'none'; }

    function handleAdClick(targetTitle) {
      closePopup(); 
      if (!targetTitle) return; 
      const targetIndex = products.findIndex(p => p.title === targetTitle);
      if (targetIndex !== -1) {
        const p = products[targetIndex];
        if (currentCategory !== '全部' && p.category !== currentCategory) setCategory(p.category); 
        setTimeout(() => {
          const cardBtn = document.getElementById(`btn-${targetIndex}`);
          if (cardBtn) {
            cardBtn.scrollIntoView({ behavior: 'smooth', block: 'center' });
            const cardElement = cardBtn.closest('.product-card');
            cardElement.style.boxShadow = '0 0 25px #ff4d4d';
            setTimeout(() => cardElement.style.boxShadow = '0 4px 10px rgba(0, 0, 0, 0.15)', 2000);
            if (!selectedItems[targetTitle]) toggleSelect(targetTitle, targetIndex);
          }
        }, 150);
      }
    }

    function renderCategories() {
      const nav = document.getElementById('category-nav');
      const uniqueCategories = ['全部', ...new Set(products.map(p => p.category))];
      nav.innerHTML = uniqueCategories.map(cat => 
        `<button class="cat-btn ${cat === currentCategory ? 'active' : ''}" onclick="setCategory('${cat}')">${cat}</button>`
      ).join('');
    }

    function setCategory(cat) { currentCategory = cat; renderCategories(); renderProducts(); }

    function renderProducts() {
      const container = document.getElementById('product-container');
      container.innerHTML = '';
      products.forEach((item, index) => {
        const statusStr = (item.status || '').toString().trim().toUpperCase();
        if (statusStr === 'N' || statusStr === '下架') return;
        if (currentCategory !== '全部' && item.category !== currentCategory) return;
        
        // 如果記憶裡有該商品數量，讀取出來
        const memoryQty = selectedItems[item.title] || 1;
        const embedUrl = getEmbedUrl(item.youtube);
        const card = document.createElement('div');
        card.className = 'product-card'; card.id = `card-${index}`;
        card.innerHTML = `
          <div class="media-container" id="media-${index}" onclick="playVideo(${index})">
            <img src="${item.image}" alt="${item.title}" onerror="this.src='https://via.placeholder.com/300x220?text=無圖片';">
            <div class="play-button"></div>
            <iframe id="iframe-${index}" src="${embedUrl}" title="${item.title}" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
          </div>
          <div class="card-info">
            <div>
              <div class="title">${item.title}</div>
              <div class="price-group">
                售價 <span class="original-price">NT$${item.originalPrice}</span>
                特價 <span class="special-price">NT$${item.specialPrice}</span>
              </div>
            </div>
            <div class="quantity-control">
              <div class="qty-btn" onclick="changeQty(${index}, -1)">-</div>
              <span class="qty-number" id="qty-${index}">${memoryQty}</span>
              <div class="qty-btn" onclick="changeQty(${index}, 1)">+</div>
            </div>
            <button class="add-cart-btn" id="btn-${index}" onclick="toggleSelect('${item.title}', ${index})">
              ＋ 加入購買清單
            </button>
          </div>
        `;
        container.appendChild(card);
      });
      syncCartButtons();
    }

    function syncCartButtons() {
      products.forEach((item, index) => {
        const btn = document.getElementById(`btn-${index}`);
        if (btn) {
          if (selectedItems[item.title]) {
            btn.innerText = '✓ 已加入清單'; btn.classList.add('selected');
            document.getElementById(`qty-${index}`).innerText = selectedItems[item.title];
          } else {
            btn.innerText = '＋ 加入購買清單'; btn.classList.remove('selected');
            document.getElementById(`qty-${index}`).innerText = 1; // 回復預設1
          }
        }
      });
    }

    function playVideo(index) {
      const mediaBox = document.getElementById(`media-${index}`);
      const iframe = document.getElementById(`iframe-${index}`);
      mediaBox.classList.add('playing');
      let currentSrc = iframe.src;
      if (!currentSrc.includes('autoplay=1')) { iframe.src = currentSrc + (currentSrc.includes('?') ? '&' : '?') + 'autoplay=1'; }
    }

    function changeQty(index, delta) {
      const qtySpan = document.getElementById(`qty-${index}`);
      let currentQty = parseInt(qtySpan.innerText);
      currentQty += delta;
      if (currentQty < 1) currentQty = 1;
      qtySpan.innerText = currentQty;
      const title = products[index].title;
      
      if (selectedItems[title]) {
        selectedItems[title] = currentQty;
        saveCart(); // 💾 儲存變更
        if (document.getElementById('cart-modal-overlay').style.display === 'flex') openCartModal();
      }
    }

    function toggleSelect(title, index) {
      const currentQty = parseInt(document.getElementById(`qty-${index}`).innerText);
      if (selectedItems[title]) {
        delete selectedItems[title];
      } else {
        selectedItems[title] = currentQty;
      }
      saveCart(); // 💾 儲存變更
      syncCartButtons();
      updateCartUI();
    }

    function updateCartUI() {
      const count = Object.keys(selectedItems).length;
      const cartBtn = document.getElementById('floating-cart');
      if (count > 0) {
        cartBtn.innerHTML = `🛒 已選取 <span id="cart-count">${count}</span> 項（點此查看清單）`;
        cartBtn.style.display = 'block';
      } else {
        cartBtn.style.display = 'none';
      }
    }

    function openCartModal() {
      const container = document.getElementById('cart-items-container');
      container.innerHTML = '';
      let totalPrice = 0;
      if (Object.keys(selectedItems).length === 0) return;

      for (let title in selectedItems) {
        const qty = selectedItems[title];
        const product = products.find(p => p.title === title);
        let price = product ? (parseInt(product.specialPrice) || parseInt(product.originalPrice) || 0) : 0;
        totalPrice += price * qty;
        
        container.innerHTML += `
          <div class="cart-item">
            <div class="cart-item-info">
              <div class="cart-item-title">${title}</div>
              <div class="cart-item-price">單價 NT$${price}</div>
            </div>
            <div class="cart-item-actions">
              <div class="quantity-control" style="margin-bottom: 0;">
                <div class="qty-btn" style="width:28px; height:28px; font-size:1.2rem;" onclick="updateCartItemQty('${title}', -1)">-</div>
                <span class="qty-number" style="font-size:1.1rem; min-width:20px;">${qty}</span>
                <div class="qty-btn" style="width:28px; height:28px; font-size:1.2rem;" onclick="updateCartItemQty('${title}', 1)">+</div>
              </div>
              <button class="cart-del-btn" onclick="removeCartItem('${title}')">✖</button>
            </div>
          </div>
        `;
      }
      document.getElementById('cart-total-price').innerText = `NT$${totalPrice}`;
      document.getElementById('cart-modal-overlay').style.display = 'flex';
    }

    function closeCartModal() { document.getElementById('cart-modal-overlay').style.display = 'none'; }

    function updateCartItemQty(title, delta) {
      let currentQty = selectedItems[title];
      currentQty += delta;
      if (currentQty < 1) currentQty = 1; 
      selectedItems[title] = currentQty;
      saveCart(); // 💾 儲存變更
      syncCartButtons();
      openCartModal();   
    }

    function removeCartItem(title) {
      delete selectedItems[title];
      saveCart(); // 💾 儲存變更
      updateCartUI();
      syncCartButtons();
      if (Object.keys(selectedItems).length === 0) { closeCartModal(); } else { openCartModal(); }
    }

    // 🚀 全新傳送機制：自動複製 + 跳轉對話框
    function confirmSendToLine() {
      if (Object.keys(selectedItems).length === 0) return;
      if (!lineProfileUrl) {
        alert("請先在試算表【設定】分頁設定 LINE 連結！");
        return;
      }
      
      let totalPrice = 0;
      let message = "你好！我想購買以下煙火商品：\n------------------------\n";
      
      for (let title in selectedItems) { 
        const qty = selectedItems[title];
        const product = products.find(p => p.title === title);
        let price = product ? (parseInt(product.specialPrice) || parseInt(product.originalPrice) || 0) : 0;
        totalPrice += price * qty;
        message += `• ${title} x ${qty}\n`; 
      }
      
      message += "------------------------\n";
      message += `💰 預估總金額：NT$${totalPrice}\n\n`;
      message += "請問目前都有現貨嗎？";
      
      // 自動複製文字到剪貼簿，然後跳轉到你的個人 LINE 頁面
      navigator.clipboard.writeText(message).then(() => {
        alert("✅ 訂單內容已自動複製！\n\n即將為您打開 LINE，請直接在對話框「貼上」並送出即可！");
        window.location.href = lineProfileUrl; // 直接跳轉到你的帳號
      }).catch(err => {
        // 如果瀏覽器不支援自動複製，採用備用方案 (原本的分享模式)
        const fallbackUrl = `https://line.me/R/msg/text/?${encodeURIComponent(message)}`;
        window.location.href = fallbackUrl;
      });
    }

    window.addEventListener('scroll', () => {
      const tools = document.getElementById('floating-tools');
      if (window.scrollY > 200) { tools.style.opacity = '1'; tools.style.pointerEvents = 'auto'; } 
      else { tools.style.opacity = '0'; tools.style.pointerEvents = 'none'; }
    });

    loadProducts();
  </script>
</body>
</html>
