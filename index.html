<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FONG 煙火精選目錄</title>

  <!-- ======================================================== -->
  <!-- ⬇️【LINE / 社交軟體 網址預覽卡片設定 (OG 標籤)】⬇️ -->
  <!-- ======================================================== -->
  <meta property="og:title" content="FONG 煙火精選商品目錄">
  <meta property="og:description" content="提供最新煙火款式、價格及現場施放影片展示，歡迎選購！">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://fong-shop.github.io/Fong/">
  
  <!-- LINE 貼上網址時顯示的預覽大圖 (需寫完整網址) -->
  <meta property="og:image" content="https://fong-shop.github.io/Fong/messageImage_1785794548467.jpg">

  <style>
    * { box-sizing: border-box; }
    body {
      font-family: Arial, sans-serif;
      background-color: #f4f4f4;
      margin: 0;
      padding: 20px;
      display: flex;
      justify-content: center;
    }

    .container {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 20px;
      max-width: 1000px;
      width: 100%;
    }

    .product-card {
      background-color: #000;
      color: #fff;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.15);
      border: 2px solid #000;
      display: flex;
      flex-direction: column;
    }

    /* 圖片與影片容器 */
    .media-container {
      position: relative;
      width: 100%;
      height: 220px;
      cursor: pointer;
      background-color: #222;
    }

    /* 封面圖 */
    .media-container img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      position: absolute;
      top: 0;
      left: 0;
      z-index: 10;
      transition: opacity 0.3s;
    }

    /* 播放按鈕圖示 */
    .play-button {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 50px;
      height: 50px;
      background-color: rgba(0, 0, 0, 0.7);
      border-radius: 50%;
      border: 2px solid #fff;
      z-index: 20;
      display: flex;
      justify-content: center;
      align-items: center;
      transition: all 0.2s;
    }

    .play-button::after {
      content: '';
      display: block;
      width: 0;
      height: 0;
      border-style: solid;
      border-width: 10px 0 10px 18px;
      border-color: transparent transparent transparent #fff;
      margin-left: 4px;
    }

    .media-container:hover .play-button {
      transform: translate(-50%, -50%) scale(1.1);
      background-color: rgba(255, 0, 0, 0.85);
    }

    /* 預藏 iframe 影片 */
    .media-container iframe {
      width: 100%;
      height: 100%;
      border: none;
      position: absolute;
      top: 0;
      left: 0;
      z-index: 5;
    }

    /* 點擊播放後，隱藏封面圖與播放按鈕 */
    .media-container.playing img,
    .media-container.playing .play-button {
      opacity: 0;
      pointer-events: none;
    }

    /* 文字欄位 */
    .card-info {
      padding: 15px;
      text-align: center;
    }

    .title {
      font-size: 1.1rem;
      font-weight: bold;
      margin-bottom: 8px;
    }

    .price-group {
      font-size: 0.95rem;
    }

    .original-price {
      text-decoration: line-through;
      color: #aaa;
      margin-right: 8px;
    }

    .special-price {
      color: #ff4d4d;
      font-weight: bold;
      font-size: 1.1rem;
    }
  </style>
</head>
<body>

  <!-- 自動渲染卡片的容器 -->
  <div class="container" id="product-container"></div>

  <script>
    // ========================================================
    // ⬇️【商品資料編輯區】以後要在這裡新增商品！⬇️
    // ========================================================
    const products = [
      {
        title: "蘋果小高空(大花)",
        image: "511198_0.jpg",
        youtube: "https://www.youtube.com/watch?v=IyQ0Q_4oKbo",
        originalPrice: 150,
        specialPrice: 50
      },
      {
        title: "雙泡泡小高空(雙花)",
        image: "511200_0.jpg",
        youtube: "https://www.youtube.com/watch?v=pSP0lhrX5dI",
        originalPrice: 150,
        specialPrice: 50
      },
      // ⬇️ 今後新增商品，請複製下方格式貼在上面這行之後：
      /*
      {
        title: "商品名稱",
        image: "圖片檔名.jpg",
        youtube: "https://www.youtube.com/watch?v=影片ID",
        originalPrice: 200,
        specialPrice: 100
      },
      */
    ];
    // ========================================================
    // ⬆️【商品資料編輯區結束】⬆️
    // ========================================================

    // 自動抓取 YouTube ID 並轉成內嵌網址
    function getEmbedUrl(url) {
      if (!url) return '';
      let videoId = '';
      if (url.includes('v=')) {
        videoId = url.split('v=')[1].split('&')[0];
      } else if (url.includes('youtu.be/')) {
        videoId = url.split('youtu.be/')[1].split('?')[0];
      }
      return `https://www.youtube.com/embed/${videoId}?enablejsapi=1`;
    }

    // 動態生成 HTML 商品卡片
    const container = document.getElementById('product-container');

    products.forEach((item, index) => {
      const embedUrl = getEmbedUrl(item.youtube);
      const card = document.createElement('div');
      card.className = 'product-card';
      
      card.innerHTML = `
        <div class="media-container" id="media-${index}" onclick="playVideo(${index})">
          <img src="${item.image}" alt="${item.title}" onerror="this.src='https://via.placeholder.com/300x220?text=無圖片';">
          <div class="play-button"></div>
          <iframe id="iframe-${index}" src="${embedUrl}" title="${item.title}" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
        </div>
        <div class="card-info">
          <div class="title">${item.title}</div>
          <div class="price-group">
            售價 <span class="original-price">NT$${item.originalPrice}</span>
            特價 <span class="special-price">NT$${item.specialPrice}</span>
          </div>
        </div>
      `;
      container.appendChild(card);
    });

    // 點擊圖片播放影片邏輯
    function playVideo(index) {
      const mediaBox = document.getElementById(`media-${index}`);
      const iframe = document.getElementById(`iframe-${index}`);

      mediaBox.classList.add('playing');

      let currentSrc = iframe.src;
      if (!currentSrc.includes('autoplay=1')) {
        iframe.src = currentSrc + (currentSrc.includes('?') ? '&' : '?') + 'autoplay=1';
      }
    }
  </script>

</body>
</html>
