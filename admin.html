<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FONG 煙火管理後台</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #121212; color: #e0e0e0;
      margin: 0; padding: 15px; display: flex; flex-direction: column; align-items: center;
    }
    .admin-card {
      width: 100%; max-width: 600px; background: #1e1e1e; border-radius: 12px;
      padding: 20px; box-shadow: 0 4px 20px rgba(0,0,0,0.5); border: 1px solid #333;
    }
    .header-row {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 20px; border-bottom: 1px solid #333; padding-bottom: 12px;
      flex-wrap: wrap; gap: 8px;
    }
    .header-title { font-size: 1.25rem; font-weight: bold; color: #ffcc00; }
    .header-actions { display: flex; gap: 8px; font-size: 0.85rem; }
    .btn-text { color: #ff4d4d; cursor: pointer; text-decoration: none; font-weight: bold; }
    
    .nav-tabs { display: flex; gap: 8px; margin-bottom: 20px; }
    .tab-btn {
      flex: 1; padding: 10px; background: #2a2a2a; color: #aaa; border: 1px solid #444;
      border-radius: 8px; cursor: pointer; font-weight: bold; font-size: 0.95rem; text-align: center;
    }
    .tab-btn.active { background: #ff4d4d; color: #fff; border-color: #ff4d4d; }

    .form-group { margin-bottom: 15px; display: flex; flex-direction: column; gap: 6px; }
    label { font-size: 0.88rem; color: #bbb; font-weight: bold; }
    input, select, textarea {
      width: 100%; background: #2a2a2a; border: 1px solid #444; color: #fff;
      padding: 10px 12px; border-radius: 6px; font-size: 0.95rem; outline: none;
    }
    input:focus, select:focus, textarea:focus { border-color: #ffcc00; }
    textarea { resize: vertical; height: 75px; }

    .image-preview-container {
      display: flex; gap: 10px; align-items: center; margin-top: 5px;
    }
    .img-preview {
      width: 65px; height: 65px; border-radius: 6px; object-fit: cover;
      background: #000; border: 1px solid #444; display: none;
    }
    .btn-camera {
      background: #ff9900; color: #000; padding: 8px 12px; border-radius: 6px;
      font-weight: bold; cursor: pointer; border: none; font-size: 0.85rem;
      display: inline-flex; align-items: center; gap: 4px;
    }

    .btn-submit {
      width: 100%; padding: 12px; background: #28a745; color: #fff; border: none;
      border-radius: 8px; font-size: 1.05rem; font-weight: bold; cursor: pointer;
      margin-top: 10px; transition: 0.2s;
    }
    .btn-submit:hover { background: #218838; }

    /* 🔐 登入彈窗 */
    .login-overlay {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.92); z-index: 3000; display: flex;
      justify-content: center; align-items: center; padding: 20px;
    }
    .login-box {
      width: 100%; max-width: 360px; background: #1e1e1e; border-radius: 12px;
      padding: 25px 20px; border: 2px solid #ffcc00; text-align: center;
    }

    /* 💬 系統提示彈窗 */
    .popup-overlay {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background-color: rgba(0, 0, 0, 0.85); z-index: 3500; display: none; 
      justify-content: center; align-items: center; padding: 15px; backdrop-filter: blur(3px);
    }
    .popup-content {
      position: relative; max-width: 380px; width: 100%;
      background: #181818; border-radius: 14px; border: 2px solid #ffcc00;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6); padding: 22px 16px;
      text-align: center; color: #fff;
    }
  </style>
</head>
<body>

  <!-- 🔐 登入彈窗 -->
  <div class="login-overlay" id="login-overlay">
    <div class="login-box">
      <h2 style="color:#ffcc00; margin-top:0;">🔒 管理者安全驗證</h2>
      <div class="form-group" style="text-align:left;">
        <label>請輸入後台管理密碼：</label>
        <input type="password" id="input-admin-key" placeholder="請輸入密碼">
      </div>
      <button class="btn-submit" onclick="verifyLogin()" style="background:#06C755;">🔑 登入管理系統</button>
    </div>
  </div>

  <!-- 💬 客製化系統提示彈窗 -->
  <div class="popup-overlay" id="admin-toast-modal">
    <div class="popup-content">
      <div style="font-size: 1.2rem; font-weight: bold; color: #ffcc00; margin-bottom: 10px;" id="admin-toast-title">💡 提示</div>
      <div id="admin-toast-msg" style="font-size: 0.95rem; color: #ddd; margin-bottom: 20px; white-space: pre-wrap;"></div>
      <button class="btn-submit" onclick="closeAdminToast()" style="padding: 10px; font-size: 0.95rem;">確定</button>
    </div>
  </div>

  <div class="admin-card">
    <div class="header-row">
      <div class="header-title">🛠️ FONG 煙火管理後台</div>
      <div class="header-actions">
        <span class="btn-text" onclick="logoutAdmin()">🔓 登出</span>
        <span style="color:#555;">|</span>
        <a href="index.html" class="btn-text" style="color:#aaa;">⬅ 回前台</a>
      </div>
    </div>

    <!-- 頁籤選單 -->
    <div class="nav-tabs">
      <div class="tab-btn active" id="tab-products" onclick="switchTab('products')">📦 單品管理</div>
      <div class="tab-btn" id="tab-packages" onclick="switchTab('packages')">🎁 套裝管理</div>
      <div class="tab-btn" id="tab-settings" onclick="switchTab('settings')">⚙️ 網站設定</div>
    </div>

    <!-- 📦 1. 單品管理表單 -->
    <div id="sec-products">
      <div class="form-group">
        <label>選擇已有單品（點擊帶入編輯）：</label>
        <select id="select-product" onchange="fillProductForm()"><option value="">-- 新增新商品 --</option></select>
      </div>
      <div class="form-group">
        <label>商品名稱：</label>
        <input type="text" id="p-title" placeholder="例如：蘋果小高空(大花)">
      </div>
      <div class="form-group">
        <label>圖片檔名 / 網址（可拍照或點選圖片上傳）：</label>
        <div style="display:flex; gap:8px;">
          <input type="text" id="p-image" placeholder="https://..." style="flex-grow:1;">
          <button class="btn-camera" onclick="triggerCamera('p-image')">📷 拍照/選圖</button>
        </div>
        <div class="image-preview-container">
          <img id="p-image-preview" class="img-preview" alt="預覽">
          <span id="p-image-status" style="font-size:0.8rem; color:#aaa;"></span>
        </div>
      </div>
      <div class="form-group">
        <label>YouTube 影片網址（選填）：</label>
        <input type="text" id="p-youtube" placeholder="https://www.youtube.com/watch?v=...">
      </div>
      <div style="display:flex; gap:10px;">
        <div class="form-group" style="flex:1;">
          <label>原價：</label>
          <input type="number" id="p-originalPrice" placeholder="150">
        </div>
        <div class="form-group" style="flex:1;">
          <label>特價：</label>
          <input type="number" id="p-specialPrice" placeholder="99">
        </div>
      </div>
      <div style="display:flex; gap:10px;">
        <div class="form-group" style="flex:1;">
          <label>分類：</label>
          <input type="text" id="p-category" placeholder="天上飛 / 地上轉">
        </div>
        <div class="form-group" style="flex:1;">
          <label>狀態：</label>
          <select id="p-status">
            <option value="">上架中</option>
            <option value="N">下架 (N)</option>
          </select>
        </div>
      </div>
      <button class="btn-submit" id="btn-save-product" onclick="saveProduct()">💾 儲存單品資料</button>
    </div>

    <!-- 🎁 2. 套裝管理表單 -->
    <div id="sec-packages" style="display:none;">
      <div class="form-group">
        <label>選擇已有套裝（點擊帶入編輯）：</label>
        <select id="select-package" onchange="fillPackageForm()"><option value="">-- 新增套裝 --</option></select>
      </div>
      <div class="form-group">
        <label>套裝名稱：</label>
        <input type="text" id="pkg-title" placeholder="例如：真●土豪套餐">
      </div>
      <div class="form-group">
        <label>包含內容（以逗號分隔，品項*數量）：</label>
        <textarea id="pkg-detail" placeholder="蘋果小高空(大花)*1, 炸花大吐珠(不吐)*1, 一發入魂(特效花束)*1"></textarea>
      </div>
      <div style="display:flex; gap:10px;">
        <div class="form-group" style="flex:1;">
          <label>原價（可空白自動加總）：</label>
          <input type="number" id="pkg-originalPrice" placeholder="留空自動計算">
        </div>
        <div class="form-group" style="flex:1;">
          <label>特價：</label>
          <input type="number" id="pkg-specialPrice" placeholder="399">
        </div>
      </div>
      <div style="display:flex; gap:10px;">
        <div class="form-group" style="flex:1;">
          <label>分類：</label>
          <input type="text" id="pkg-category" value="超值套裝">
        </div>
        <div class="form-group" style="flex:1;">
          <label>狀態：</label>
          <select id="pkg-status">
            <option value="">上架中</option>
            <option value="N">下架 (N)</option>
          </select>
        </div>
      </div>
      <button class="btn-submit" id="btn-save-package" onclick="savePackage()">💾 儲存套裝資料</button>
    </div>

    <!-- ⚙️ 3. 網站設定表單 -->
    <div id="sec-settings" style="display:none;">
      <div class="form-group">
        <label>📢 公告內容：</label>
        <textarea id="set-announcement" placeholder="例如：📢 最新公告：歡迎光臨 FONG 煙火精選目錄！..."></textarea>
      </div>
      <div class="form-group">
        <label>💬 LINE 官方帳號連結：</label>
        <input type="text" id="set-line" placeholder="https://line.me/ti/p/...">
      </div>
      <div class="form-group">
        <label>🎁 滿額門檻 (達標集1點)：</label>
        <input type="number" id="set-threshold" placeholder="600">
      </div>
      <div class="form-group">
        <label>🎁 滿額贈品池 (名稱*消耗點數，逗號分隔)：</label>
        <textarea id="set-rewards" placeholder="蘋果小高空(大花)*0.5, 3元笛音火箭(盒裝)*1, 炸花大吐珠(不吐)*2"></textarea>
      </div>
      <div class="form-group">
        <label>🔥 主打推薦商品 (名稱逗號分隔)：</label>
        <input type="text" id="set-featured">
      </div>
      <button class="btn-submit" id="btn-save-set" onclick="saveSettings()">💾 儲存網站設定</button>
    </div>

  </div>

  <!-- 📷 隱藏式拍照檔案選擇器 -->
  <input type="file" id="camera-file-input" accept="image/*" capture="environment" style="display: none;" onchange="handleCameraUpload(this)">

<script>
  const GAS_API_URL = "https://script.google.com/macros/s/AKfycbzdvebTnsOSgEURWczwLjLuQPIz9tbHWKSpEIgsT38V5jR7vzHUHbFiPGtH5F0rQJEZWA/exec";

  let adminKey = "";
  let siteData = { products: [], packages: [], settings: {} };
  let currentUploadTarget = "";

  function showAdminToast(msg, title = "💡 系統提示") {
    document.getElementById('admin-toast-title').innerText = title;
    document.getElementById('admin-toast-msg').innerText = msg;
    document.getElementById('admin-toast-modal').style.display = 'flex';
  }

  function closeAdminToast() {
    document.getElementById('admin-toast-modal').style.display = 'none';
  }

  function checkSavedAuth() {
    const savedKey = localStorage.getItem('fong_admin_key');
    if (savedKey) {
      adminKey = savedKey;
      document.getElementById('login-overlay').style.display = 'none';
      loadAllData();
    }
  }

  function verifyLogin() {
    const inputKey = document.getElementById('input-admin-key').value.trim();
    if (!inputKey) { showAdminToast('請輸入密碼！', '🔒 驗證失敗'); return; }
    adminKey = inputKey;
    localStorage.setItem('fong_admin_key', adminKey);
    document.getElementById('login-overlay').style.display = 'none';
    loadAllData();
  }

  function logoutAdmin() {
    localStorage.removeItem('fong_admin_key');
    location.reload();
  }

  async function loadAllData() {
    try {
      const res = await fetch(GAS_API_URL + '?t=' + new Date().getTime());
      const data = await res.json();
      
      if (data.error) {
        showAdminToast("後端傳回錯誤：" + data.error, "❌ 讀取失敗");
        return;
      }

      siteData = data;
      renderDropdowns();
      fillSettingsForm();
    } catch (e) {
      showAdminToast("讀取後台資料失敗: " + e.message, "❌ 連線失敗");
    }
  }

  function renderDropdowns() {
    const pSelect = document.getElementById('select-product');
    pSelect.innerHTML = '<option value="">-- 新增新商品 --</option>';
    (siteData.products || []).forEach((p, idx) => {
      const title = p['商品名稱'] || p.title || `商品 ${idx+1}`;
      pSelect.innerHTML += `<option value="${idx}">${title}</option>`;
    });

    const pkgSelect = document.getElementById('select-package');
    pkgSelect.innerHTML = '<option value="">-- 新增套裝 --</option>';
    (siteData.packages || []).forEach((pkg, idx) => {
      const title = pkg['商品名稱'] || pkg['套裝名稱'] || pkg.title || `套裝 ${idx+1}`;
      pkgSelect.innerHTML += `<option value="${idx}">${title}</option>`;
    });
  }

  function fillProductForm() {
    const idx = document.getElementById('select-product').value;
    if (idx === "") {
      document.getElementById('p-title').value = '';
      document.getElementById('p-image').value = '';
      document.getElementById('p-youtube').value = '';
      document.getElementById('p-originalPrice').value = '';
      document.getElementById('p-specialPrice').value = '';
      document.getElementById('p-category').value = '';
      document.getElementById('p-status').value = '';
      document.getElementById('p-image-preview').style.display = 'none';
      return;
    }
    const p = siteData.products[idx];
    document.getElementById('p-title').value = p['商品名稱'] || p.title || '';
    document.getElementById('p-image').value = p['圖片檔名'] || p.image || '';
    document.getElementById('p-youtube').value = p['影片網址'] || p.youtube || '';
    document.getElementById('p-originalPrice').value = p['原價'] || p.originalPrice || '';
    document.getElementById('p-specialPrice').value = p['特價'] || p.specialPrice || '';
    document.getElementById('p-category').value = p['分類'] || p.category || '';
    document.getElementById('p-status').value = p['狀態'] || p.status || '';

    const imgUrl = p['圖片檔名'] || p.image;
    if (imgUrl) {
      const prev = document.getElementById('p-image-preview');
      prev.src = imgUrl; prev.style.display = 'block';
    }
  }

  function fillPackageForm() {
    const idx = document.getElementById('select-package').value;
    if (idx === "") {
      document.getElementById('pkg-title').value = '';
      document.getElementById('pkg-detail').value = '';
      document.getElementById('pkg-originalPrice').value = '';
      document.getElementById('pkg-specialPrice').value = '';
      document.getElementById('pkg-category').value = '超值套裝';
      document.getElementById('pkg-status').value = '';
      return;
    }
    const pkg = siteData.packages[idx];
    document.getElementById('pkg-title').value = pkg['商品名稱'] || pkg['套裝名稱'] || pkg.title || '';
    document.getElementById('pkg-detail').value = pkg['包含內容'] || pkg.packageDetail || '';
    document.getElementById('pkg-originalPrice').value = pkg['原價'] || pkg.originalPrice || '';
    document.getElementById('pkg-specialPrice').value = pkg['特價'] || pkg.specialPrice || '';
    document.getElementById('pkg-category').value = pkg['分類'] || pkg.category || '超值套裝';
    document.getElementById('pkg-status').value = pkg['狀態'] || pkg.status || '';
  }

  function fillSettingsForm() {
    const s = siteData.settings || {};
    document.getElementById('set-announcement').value = s['公告內容'] || '';
    document.getElementById('set-line').value = s['LINE連結'] || '';
    document.getElementById('set-threshold').value = s['滿額門檻'] || '';
    document.getElementById('set-rewards').value = s['滿額贈品'] || '';
    document.getElementById('set-featured').value = s['主打商品'] || '';
  }

  function switchTab(tab) {
    document.getElementById('tab-products').classList.remove('active');
    document.getElementById('tab-packages').classList.remove('active');
    document.getElementById('tab-settings').classList.remove('active');
    
    document.getElementById('sec-products').style.display = 'none';
    document.getElementById('sec-packages').style.display = 'none';
    document.getElementById('sec-settings').style.display = 'none';

    document.getElementById(`tab-${tab}`).classList.add('active');
    document.getElementById(`sec-${tab}`).style.display = 'block';
  }

  function triggerCamera(targetInputId) {
    currentUploadTarget = targetInputId;
    document.getElementById('camera-file-input').click();
  }

  async function handleCameraUpload(input) {
    if (!input.files || !input.files[0]) return;
    const file = input.files[0];
    const statusSpan = document.getElementById('p-image-status');
    statusSpan.innerText = '📷 圖片壓縮處理中...';

    const base64 = await compressImage(file, 1024, 0.8);
    statusSpan.innerText = '🚀 正在上傳至 Google Drive...';

    try {
      const res = await fetch(GAS_API_URL, {
        method: 'POST',
        headers: { "Content-Type": "text/plain;charset=utf-8" },
        body: JSON.stringify({
          adminKey: adminKey,
          action: "uploadImage",
          base64Data: base64
        })
      });
      const result = await res.json();
      if (result.success) {
        document.getElementById(currentUploadTarget).value = result.url;
        statusSpan.innerText = '✅ 圖片上傳成功！';
        const prev = document.getElementById('p-image-preview');
        prev.src = result.url; prev.style.display = 'block';
      } else {
        showAdminToast("上傳失敗: " + result.message, "❌ 上傳失敗");
        statusSpan.innerText = '❌ 上傳失敗';
      }
    } catch (e) {
      showAdminToast("上傳失敗: " + e.message, "❌ 上傳失敗");
      statusSpan.innerText = '❌ 上傳失敗';
    }
  }

  function compressImage(file, maxWidth, quality) {
    return new Promise((resolve) => {
      const reader = new FileReader();
      reader.readAsDataURL(file);
      reader.onload = (event) => {
        const img = new Image();
        img.src = event.target.result;
        img.onload = () => {
          let width = img.width;
          let height = img.height;
          if (width > maxWidth) {
            height = Math.round((height * maxWidth) / width);
            width = maxWidth;
          }
          const canvas = document.createElement('canvas');
          canvas.width = width; canvas.height = height;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, width, height);
          resolve(canvas.toDataURL('image/jpeg', quality));
        };
      };
    });
  }

  async function saveProduct() {
    const title = document.getElementById('p-title').value.trim();
    if (!title) { showAdminToast('請填寫商品名稱！', '⚠️ 資料不完整'); return; }

    const productData = {
      title: title,
      image: document.getElementById('p-image').value.trim(),
      youtube: document.getElementById('p-youtube').value.trim(),
      originalPrice: document.getElementById('p-originalPrice').value,
      specialPrice: document.getElementById('p-specialPrice').value,
      category: document.getElementById('p-category').value.trim(),
      status: document.getElementById('p-status').value
    };

    document.getElementById('btn-save-product').innerText = '⏳ 儲存中...';

    try {
      const res = await fetch(GAS_API_URL, {
        method: 'POST',
        headers: { "Content-Type": "text/plain;charset=utf-8" },
        body: JSON.stringify({
          adminKey: adminKey,
          action: "saveProduct",
          product: productData
        })
      });
      const result = await res.json();
      showAdminToast(result.message, result.success ? "✅ 儲存成功" : "❌ 儲存失敗");
      if (result.success) loadAllData();
    } catch (e) {
      showAdminToast("儲存失敗: " + e.message, "❌ 儲存失敗");
    } finally {
      document.getElementById('btn-save-product').innerText = '💾 儲存單品資料';
    }
  }

  async function savePackage() {
    const title = document.getElementById('pkg-title').value.trim();
    if (!title) { showAdminToast('請填寫套裝名稱！', '⚠️ 資料不完整'); return; }

    const pkgData = {
      title: title,
      image: '',
      youtube: '',
      originalPrice: document.getElementById('pkg-originalPrice').value,
      specialPrice: document.getElementById('pkg-specialPrice').value,
      category: document.getElementById('pkg-category').value.trim(),
      status: document.getElementById('pkg-status').value,
      packageDetail: document.getElementById('pkg-detail').value.trim()
    };

    document.getElementById('btn-save-package').innerText = '⏳ 儲存中...';

    try {
      const res = await fetch(GAS_API_URL, {
        method: 'POST',
        headers: { "Content-Type": "text/plain;charset=utf-8" },
        body: JSON.stringify({
          adminKey: adminKey,
          action: "savePackage",
          package: pkgData
        })
      });
      const result = await res.json();
      showAdminToast(result.message, result.success ? "✅ 儲存成功" : "❌ 儲存失敗");
      if (result.success) loadAllData();
    } catch (e) {
      showAdminToast("儲存失敗: " + e.message, "❌ 儲存失敗");
    } finally {
      document.getElementById('btn-save-package').innerText = '💾 儲存套裝資料';
    }
  }

  async function saveSettings() {
    const settingsData = {
      '公告內容': document.getElementById('set-announcement').value.trim(),
      'LINE連結': document.getElementById('set-line').value.trim(),
      '滿額門檻': document.getElementById('set-threshold').value.trim(),
      '滿額贈品': document.getElementById('set-rewards').value.trim(),
      '主打商品': document.getElementById('set-featured').value.trim()
    };

    document.getElementById('btn-save-set').innerText = '⏳ 儲存中...';

    try {
      const res = await fetch(GAS_API_URL, {
        method: 'POST',
        headers: { "Content-Type": "text/plain;charset=utf-8" },
        body: JSON.stringify({
          adminKey: adminKey,
          action: "saveSettings",
          settings: settingsData
        })
      });
      const result = await res.json();
      showAdminToast(result.message, result.success ? "✅ 儲存成功" : "❌ 儲存失敗");
      if (result.success) loadAllData();
    } catch (e) {
      showAdminToast("儲存失敗: " + e.message, "❌ 儲存失敗");
    } finally {
      document.getElementById('btn-save-set').innerText = '💾 儲存網站設定';
    }
  }

  checkSavedAuth();
</script>
</body>
</html>
