<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FONG 煙火管理後台</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #121212; color: #e0e0e0; margin: 0; padding: 15px; 
      display: flex; flex-direction: column; align-items: center; padding-bottom: 50px;
    }
    .admin-card {
      width: 100%; max-width: 600px; background: #1e1e1e; border-radius: 12px;
      padding: 20px; box-shadow: 0 4px 20px rgba(0,0,0,0.5); border: 1px solid #333;
    }
    .header-row {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 20px; border-bottom: 1px solid #333; padding-bottom: 12px; flex-wrap: wrap; gap: 8px;
    }
    .header-title { font-size: 1.25rem; font-weight: bold; color: #ffcc00; }
    .header-actions { display: flex; gap: 8px; font-size: 0.85rem; }
    .btn-text { color: #ff4d4d; cursor: pointer; text-decoration: none; font-weight: bold; }
    
    .nav-tabs { display: flex; gap: 8px; margin-bottom: 20px; }
    .tab-btn {
      flex: 1; padding: 10px; background: #2a2a2a; color: #aaa; border: 1px solid #444;
      border-radius: 8px; cursor: pointer; font-weight: bold; font-size: 0.95rem; text-align: center;
    }
    .tab-btn.active { background: #ff4d4d; color: #fff; border-color: #ff4d4d; }

    .form-group { margin-bottom: 15px; display: flex; flex-direction: column; gap: 6px; }
    label { font-size: 0.88rem; color: #bbb; font-weight: bold; display: flex; justify-content: space-between; align-items: center; }
    input, select, textarea {
      width: 100%; background: #2a2a2a; border: 1px solid #444; color: #fff;
      padding: 10px 12px; border-radius: 6px; font-size: 0.95rem; outline: none;
    }
    input:focus, select:focus, textarea:focus { border-color: #ffcc00; }
    textarea { resize: vertical; height: 75px; }
    input:disabled, textarea:disabled { background: #222; color: #888; cursor: not-allowed; }

    /* 頂部工具列 */
    .action-toolbar { display: flex; gap: 8px; margin-bottom: 18px; align-items: center; }
    .btn-mini {
      padding: 8px 12px; background: #333; color: #fff; border: 1px solid #555;
      border-radius: 6px; font-size: 0.85rem; cursor: pointer; font-weight: bold; transition: background 0.2s;
    }
    .btn-mini:hover { background: #444; }
    .btn-del { background: #7a1c1c; border-color: #ff4d4d; }
    .btn-del:hover { background: #9c2424; }

    .image-preview-container { display: flex; gap: 10px; align-items: center; margin-top: 5px; }
    .img-preview { width: 65px; height: 65px; border-radius: 6px; object-fit: cover; background: #000; border: 1px solid #444; display: none; }
    
    .btn-action {
      background: #ff9900; color: #000; padding: 6px 10px; border-radius: 6px;
      font-weight: bold; cursor: pointer; border: none; font-size: 0.8rem;
    }

    .btn-submit {
      width: 100%; padding: 12px; background: #28a745; color: #fff; border: none;
      border-radius: 8px; font-size: 1.05rem; font-weight: bold; cursor: pointer; margin-top: 10px;
    }

    /* 🔑 登入彈窗 */
    .modal-overlay {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.92); z-index: 3000; display: none;
      justify-content: center; align-items: center; padding: 15px;
    }
    .login-box {
      width: 100%; max-width: 480px; background: #1e1e1e; border-radius: 12px;
      padding: 24px 20px; border: 1px solid #333; text-align: center;
      box-shadow: 0 10px 30px rgba(0,0,0,0.8);
    }
    .login-title {
      font-size: 1.25rem; font-weight: bold; color: #ffcc00; margin-bottom: 20px;
      display: flex; justify-content: center; align-items: center; gap: 8px;
    }
    .login-input {
      width: 100%; background: #2a2a2a; border: 1px solid #444; color: #fff;
      padding: 12px; border-radius: 8px; font-size: 1rem; margin-bottom: 20px; outline: none;
    }
    .login-btn {
      width: 100%; padding: 14px; background: #06C755; color: #fff; border: none;
      border-radius: 8px; font-size: 1.1rem; font-weight: bold; cursor: pointer; margin-bottom: 16px;
    }
    .login-back-link {
      color: #aaa; text-decoration: none; font-size: 0.9rem; cursor: pointer; font-weight: bold;
    }

    /* 📝 視覺化選擇器與拖曳排序彈窗 */
    .modal-box {
      width: 100%; max-width: 480px; background: #1a1a1a; border-radius: 12px;
      padding: 20px; border: 2px solid #ffcc00; display: flex; flex-direction: column; max-height: 85vh;
    }
    .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
    .modal-title { font-size: 1.15rem; font-weight: bold; color: #ffcc00; margin: 0; }
    .modal-close { font-size: 1.5rem; color: #fff; cursor: pointer; line-height: 1; }
    
    .modal-list { overflow-y: auto; display: flex; flex-direction: column; gap: 8px; margin-bottom: 15px; padding-right: 5px; }
    .modal-list::-webkit-scrollbar { width: 6px; }
    .modal-list::-webkit-scrollbar-thumb { background: #555; border-radius: 3px; }
    
    .price-summary-badge {
      background: #252210; border: 1px solid #ffcc00; border-radius: 8px;
      padding: 10px; margin-bottom: 12px; text-align: center; font-size: 1rem;
      color: #ffcc00; font-weight: bold; display: none;
    }

    .drag-item {
      display: flex; justify-content: space-between; align-items: center;
      background: #252525; padding: 10px 12px; border-radius: 8px; border: 1px solid #333;
      user-select: none; transition: background 0.2s;
    }
    .drag-item:hover { border-color: #ff4d4d; }
    .drag-item.dragging { opacity: 0.4; border-color: #ffcc00; }
    .drag-handle { font-size: 1.2rem; color: #888; cursor: grab; padding-right: 10px; }
    .drag-handle:active { cursor: grabbing; }
    
    .drag-title-clickable {
      font-size: 0.95rem; font-weight: bold; color: #fff; flex: 1; cursor: pointer;
      display: flex; align-items: center; gap: 6px;
    }
    .drag-title-clickable:hover { color: #ffcc00; text-decoration: underline; }

    .drag-status-toggle {
      display: flex; align-items: center; gap: 6px; background: #1a1a1a;
      padding: 4px 8px; border-radius: 6px; border: 1px solid #444; cursor: pointer;
    }
    .drag-status-label { font-size: 0.8rem; font-weight: bold; }
    .drag-status-label.on { color: #28a745; }
    .drag-status-label.off { color: #ff4d4d; }

    .ui-item {
      display: flex; justify-content: space-between; align-items: center;
      background: #252525; padding: 10px 12px; border-radius: 8px; border: 1px solid #333;
    }
    .ui-item-title { font-size: 0.95rem; font-weight: bold; color: #fff; flex: 1; padding-right: 10px;}
    .ui-controls { display: flex; align-items: center; gap: 6px; }
    
    .qty-btn {
      width: 28px; height: 28px; background: #444; border: none; color: #fff; border-radius: 4px;
      font-size: 1.1rem; font-weight: bold; cursor: pointer; display: flex; justify-content: center; align-items: center;
    }
    .qty-input {
      width: 35px; height: 28px; text-align: center; background: #111; border: 1px solid #555;
      color: #ffcc00; font-weight: bold; border-radius: 4px; font-size: 0.95rem; padding: 0;
    }
    .pts-input {
      width: 60px; height: 30px; text-align: center; background: #111; border: 1px solid #555;
      color: #ffcc00; font-weight: bold; border-radius: 4px; font-size: 0.95rem;
    }
    input[type="checkbox"] { width: 18px; height: 18px; accent-color: #28a745; cursor: pointer; }
  </style>
</head>
<body>

  <!-- 🔑 登入彈窗 -->
  <div class="modal-overlay" id="login-overlay" style="display: flex;">
    <div class="login-box">
      <div class="login-title">🔑 請輸入後台管理密碼</div>
      <input type="password" id="input-admin-key" class="login-input" placeholder="請輸入密碼" onkeyup="if(event.key==='Enter') verifyLogin()">
      <button class="login-btn" onclick="verifyLogin()">登入管理後台</button>
      <div>
        <a href="index.html" class="login-back-link">⬅ 返回商品目錄</a>
      </div>
    </div>
  </div>

  <!-- 📝 視覺化選擇器與拖曳排序彈窗 -->
  <div class="modal-overlay" id="ui-modal">
    <div class="modal-box">
      <div class="modal-header">
        <h3 class="modal-title" id="ui-modal-title">編輯項目</h3>
        <div class="modal-close" onclick="closeUIModal()">×</div>
      </div>
      <div class="price-summary-badge" id="ui-price-summary">
        💰 目前組合內含單品原價總計：<span id="ui-total-val" style="font-size:1.2rem; color:#28a745;">NT$0</span>
      </div>
      <div class="modal-list" id="ui-modal-list"></div>
      <button class="btn-submit" id="ui-modal-save-btn" style="margin-top: 0; background: #ff9900; color: #000;" onclick="saveUISelection()">✅ 確認儲存</button>
    </div>
  </div>

  <div class="admin-card">
    <div class="header-row">
      <div class="header-title">🛠️ FONG 煙火管理後台</div>
      <div class="header-actions">
        <span class="btn-text" onclick="logoutAdmin()">🔓 登出</span> <span style="color:#555;">|</span>
        <a href="index.html" class="btn-text" style="color:#aaa;">⬅ 回前台</a>
      </div>
    </div>

    <!-- 頁籤選單 -->
    <div class="nav-tabs">
      <div class="tab-btn active" id="tab-products" onclick="switchTab('products')">📦 單品</div>
      <div class="tab-btn" id="tab-packages" onclick="switchTab('packages')">🎁 套裝</div>
      <div class="tab-btn" id="tab-settings" onclick="switchTab('settings')">⚙️ 設定</div>
    </div>

    <!-- 📦 1. 單品管理表單 -->
    <div id="sec-products">
      <div class="action-toolbar">
        <button class="btn-mini" style="background:#28a745; border-color:#28a745;" onclick="resetProductForm()">➕ 清空/新增單品</button>
        <button class="btn-mini" style="background:#007bff; border-color:#007bff;" onclick="openSortEditor('product')">🔃 列表/排序/上下架</button>
        <button class="btn-mini btn-del" id="btn-del-product" style="display:none;" onclick="deleteCurrentItem('product')">🗑️ 刪除</button>
      </div>

      <div class="form-group"><label>商品名稱：</label><input type="text" id="p-title" placeholder="名稱"></div>
      <div class="form-group">
        <label>
          圖片檔名 / 網址：
          <div style="display:flex; gap:6px;">
            <button class="btn-action" onclick="triggerPhoto('camera', 'p-image')">📷 拍照</button>
            <button class="btn-action" style="background:#00c300; color:#fff;" onclick="triggerPhoto('gallery', 'p-image')">🖼️ 選圖</button>
          </div>
        </label>
        <input type="text" id="p-image" placeholder="https://...">
        <div class="image-preview-container">
          <img id="p-image-preview" class="img-preview" alt="預覽"><span id="p-image-status" style="font-size:0.8rem; color:#aaa;"></span>
        </div>
      </div>
      <div class="form-group"><label>影片網址 (選填)：</label><input type="text" id="p-youtube" placeholder="YouTube..."></div>
      <div style="display:flex; gap:10px;">
        <div class="form-group" style="flex:1;"><label>原價：</label><input type="number" id="p-originalPrice"></div>
        <div class="form-group" style="flex:1;"><label>特價：</label><input type="number" id="p-specialPrice"></div>
      </div>
      <div class="form-group"><label>分類：</label><input type="text" id="p-category" placeholder="天上飛"></div>

      <button class="btn-submit" id="btn-save-product" onclick="saveProduct()">💾 儲存單品</button>
    </div>

    <!-- 🎁 2. 套裝管理表單 -->
    <div id="sec-packages" style="display:none;">
      <div class="action-toolbar">
        <button class="btn-mini" style="background:#28a745; border-color:#28a745;" onclick="resetPackageForm()">➕ 清空/新增套裝</button>
        <button class="btn-mini" style="background:#007bff; border-color:#007bff;" onclick="openSortEditor('package')">🔃 列表/排序/上下架</button>
        <button class="btn-mini btn-del" id="btn-del-package" style="display:none;" onclick="deleteCurrentItem('package')">🗑️ 刪除</button>
      </div>

      <div class="form-group"><label>套裝名稱：</label><input type="text" id="pkg-title" placeholder="名稱"></div>
      <div class="form-group">
        <label>包含內容：<button class="btn-action" onclick="openPackageEditor()">✏️ 編輯內容</button></label>
        <textarea id="pkg-detail" disabled placeholder="點上方按鈕自動生成"></textarea>
      </div>
      <div style="display:flex; gap:10px;">
        <div class="form-group" style="flex:1;">
          <label>原價 (自動計算金額)：</label>
          <input type="number" id="pkg-originalPrice" placeholder="自動計算總價">
        </div>
        <div class="form-group" style="flex:1;"><label>特價：</label><input type="number" id="pkg-specialPrice"></div>
      </div>
      <div class="form-group"><label>分類：</label><input type="text" id="pkg-category" value="超值套裝"></div>

      <button class="btn-submit" id="btn-save-package" onclick="savePackage()">💾 儲存套裝</button>
    </div>

    <!-- ⚙️ 3. 網站設定表單 -->
    <div id="sec-settings" style="display:none;">
      <div class="form-group"><label>📢 公告內容：</label><textarea id="set-announcement"></textarea></div>
      <div class="form-group"><label>💬 LINE 連結：</label><input type="text" id="set-line"></div>
      <div class="form-group"><label>🎁 滿額門檻 (達標集1點)：</label><input type="number" id="set-threshold"></div>
      
      <div class="form-group">
        <label>🎁 滿額贈品池：<button class="btn-action" onclick="openRewardEditor()">✏️ 選擇贈品</button></label>
        <textarea id="set-rewards" disabled></textarea>
      </div>
      <div class="form-group">
        <label>🔥 主打推播：<button class="btn-action" onclick="openFeaturedEditor()">✏️ 勾選主打</button></label>
        <textarea id="set-featured" disabled></textarea>
      </div>
      
      <div class="form-group">
        <label>💬 訂單抬頭 (送至LINE的開頭)：</label>
        <input type="text" id="set-order-header" placeholder="例如：想訂購以下商品：">
      </div>
      <div class="form-group">
        <label>🎁 訂單結尾 (含活動/目錄連結)：</label>
        <textarea id="set-order-footer" placeholder="例如：🔗 商品目錄：https://fong-shop.github.io/Fong/&#10;🎁【好友分享禮】：出示分享截圖即贈專業噴槍！&#10;&#10;請問目前都有現貨嗎？"></textarea>
      </div>

      <button class="btn-submit" id="btn-save-set" onclick="saveSettings()">💾 儲存設定</button>
    </div>

  </div>

  <input type="file" id="camera-file-input" accept="image/*" capture="environment" style="display: none;" onchange="handleCameraUpload(this)">
  <input type="file" id="gallery-file-input" accept="image/*" style="display: none;" onchange="handleCameraUpload(this)">

<script>
  const GAS_API_URL = "https://script.google.com/macros/s/AKfycbzdvebTnsOSgEURWczwLjLuQPIz9tbHWKSpEIgsT38V5jR7vzHUHbFiPGtH5F0rQJEZWA/exec";
  let adminKey = "";
  let siteData = { products: [], packages: [], settings: {} };
  let currentUploadTarget = "";
  let currentUIType = "";
  let currentEditProductIndex = -1;
  let currentEditPackageIndex = -1;

  function checkSavedAuth() {
    if (localStorage.getItem('fong_admin_key')) {
      adminKey = localStorage.getItem('fong_admin_key');
      document.getElementById('login-overlay').style.display = 'none';
      loadAllData();
      recordVisit('後台管理系統');
    }
  }

  function verifyLogin() {
    const inputKey = document.getElementById('input-admin-key').value.trim();
    if (!inputKey) return alert('請輸入密碼！');

    fetch(GAS_API_URL, {
      method: 'POST',
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify({ action: "verifyAdminKey", adminKey: inputKey })
    })
    .then(res => res.json())
    .then(result => {
      if (result.success) {
        adminKey = inputKey;
        localStorage.setItem('fong_admin_key', adminKey);
        document.getElementById('login-overlay').style.display = 'none';
        loadAllData();
        recordVisit('後台管理系統');
      } else {
        alert("❌ 登入失敗：後台管理密碼不正確！");
      }
    })
    .catch(() => alert("網路連線錯誤，請檢查 API 設定"));
  }

  async function recordVisit(sourceName) {
    try {
      let clientIp = "未知";
      try {
        const ipRes = await fetch("https://api.ipify.org?format=json");
        const ipData = await ipRes.json();
        clientIp = ipData.ip || "未知";
      } catch (e) {}

      fetch(GAS_API_URL, {
        method: "POST",
        headers: { "Content-Type": "text/plain;charset=utf-8" },
        body: JSON.stringify({ action: "logVisit", source: sourceName, ip: clientIp })
      }).catch(() => {});
    } catch (e) {}
  }

  function logoutAdmin() { localStorage.removeItem('fong_admin_key'); location.reload(); }

  function formatImageUrl(rawUrl) {
    if (!rawUrl) return '';
    let url = rawUrl.toString().trim();
    if (url.includes('drive.google.com')) {
      let fileId = '';
      if (url.includes('/d/')) { fileId = url.split('/d/')[1].split('/')[0].split('?')[0]; } 
      else if (url.includes('id=')) { fileId = url.split('id=')[1].split('&')[0]; }
      if (fileId) return `https://drive.google.com/thumbnail?id=${fileId}&sz=w1000`;
    }
    return url;
  }

  async function loadAllData() {
    try {
      const res = await fetch(GAS_API_URL + '?t=' + new Date().getTime());
      const data = await res.json();
      if (!data.success && data.error) return alert("後端傳回錯誤：" + data.error);
      siteData = data;
      fillSettingsForm();
    } catch (e) { alert("讀取資料失敗：請檢查 API 網址與網路設定"); }
  }

  function switchTab(tab) {
    ['products', 'packages', 'settings'].forEach(t => {
      document.getElementById(`tab-${t}`).classList.remove('active');
      document.getElementById(`sec-${t}`).style.display = 'none';
    });
    document.getElementById(`tab-${tab}`).classList.add('active');
    document.getElementById(`sec-${tab}`).style.display = 'block';
  }

  function calculateDetailTotalSum(detailStr) {
    if (!detailStr) return 0;
    let sum = 0;
    const parts = detailStr.split(/[,，、]/).map(s => s.trim()).filter(Boolean);
    parts.forEach(pStr => {
      const match = pStr.match(/^(.*?)\s*[*xX]\s*(\d+(\.\d+)?)$/);
      const pName = match ? match[1].trim() : pStr;
      const pQty = match ? parseFloat(match[2]) : 1;
      const target = (siteData.products || []).find(p => p['商品名稱'] === pName);
      if (target) {
        const unitPrice = parseInt(target['原價']) || parseInt(target['特價']) || 0;
        sum += unitPrice * pQty;
      }
    });
    return sum;
  }

  function resetProductForm() {
    currentEditProductIndex = -1;
    document.getElementById('btn-del-product').style.display = 'none';
    document.getElementById('p-title').value = ''; 
    document.getElementById('p-image').value = '';
    document.getElementById('p-youtube').value = ''; 
    document.getElementById('p-originalPrice').value = '';
    document.getElementById('p-specialPrice').value = ''; 
    document.getElementById('p-category').value = '';
    document.getElementById('p-image-preview').style.display = 'none';
  }

  function resetPackageForm() {
    currentEditPackageIndex = -1;
    document.getElementById('btn-del-package').style.display = 'none';
    document.getElementById('pkg-title').value = ''; 
    document.getElementById('pkg-detail').value = '';
    document.getElementById('pkg-originalPrice').value = ''; 
    document.getElementById('pkg-specialPrice').value = '';
    document.getElementById('pkg-category').value = '超值套裝';
  }

  function fillSettingsForm() {
    const s = siteData.settings || {};
    document.getElementById('set-announcement').value = s['公告內容'] || '';
    document.getElementById('set-line').value = s['LINE連結'] || '';
    document.getElementById('set-threshold').value = s['滿額門檻'] || '';
    document.getElementById('set-rewards').value = s['滿額贈品'] || '';
    document.getElementById('set-featured').value = s['主打商品'] || '';
    document.getElementById('set-order-header').value = s['訂單抬頭'] || '';
    document.getElementById('set-order-footer').value = s['訂單結尾'] || '';
  }

  function triggerPhoto(mode, targetInputId) {
    currentUploadTarget = targetInputId;
    if (mode === 'camera') {
      document.getElementById('camera-file-input').click();
    } else {
      document.getElementById('gallery-file-input').click();
    }
  }

  async function handleCameraUpload(input) {
    if (!input.files || !input.files[0]) return;
    const file = input.files[0];
    const statusSpan = document.getElementById('p-image-status');
    statusSpan.innerText = '📷 壓縮處理中...';

    const base64 = await compressImage(file, 1024, 0.8);
    statusSpan.innerText = '🚀 正在上傳至專屬資料夾...';

    try {
      const res = await fetch(GAS_API_URL, {
        method: 'POST', headers: { "Content-Type": "text/plain;charset=utf-8" },
        body: JSON.stringify({ adminKey: adminKey, action: "uploadImage", base64Data: base64 })
      });
      const result = await res.json();
      if (result.success) {
        document.getElementById(currentUploadTarget).value = result.url;
        statusSpan.innerText = '✅ 上傳成功！';
        const prev = document.getElementById('p-image-preview');
        prev.src = result.url; prev.style.display = 'block';
      } else { statusSpan.innerText = '❌ ' + result.message; }
    } catch (e) { statusSpan.innerText = '❌ 網路錯誤'; }
    input.value = '';
  }

  function compressImage(file, maxWidth, quality) {
    return new Promise((resolve) => {
      const reader = new FileReader(); reader.readAsDataURL(file);
      reader.onload = (e) => {
        const img = new Image(); img.src = e.target.result;
        img.onload = () => {
          let w = img.width, h = img.height;
          if (w > maxWidth) { h = Math.round((h * maxWidth) / w); w = maxWidth; }
          const canvas = document.createElement('canvas');
          canvas.width = w; canvas.height = h;
          canvas.getContext('2d').drawImage(img, 0, 0, w, h);
          resolve(canvas.toDataURL('image/jpeg', quality));
        };
      };
    });
  }

  async function callAPI(action, payload) {
    payload.adminKey = adminKey;
    payload.action = action;
    const res = await fetch(GAS_API_URL, {
      method: 'POST', headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify(payload)
    });
    return res.json();
  }

  async function deleteCurrentItem(type) {
    const titleId = type === 'product' ? 'p-title' : 'pkg-title';
    const title = document.getElementById(titleId).value.trim();
    if (!title) return alert("請先選擇要刪除的項目！");
    if (!confirm(`確定要刪除「${title}」嗎？此動作無法還原！`)) return;

    try {
      const res = await callAPI("deleteItem", { type: type, title: title });
      alert(res.message);
      if (res.success) {
        await loadAllData();
        type === 'product' ? resetProductForm() : resetPackageForm();
      }
    } catch(e) { alert("刪除失敗"); }
  }

  async function saveProduct() {
    const title = document.getElementById('p-title').value.trim();
    if (!title) return alert('請填寫商品名稱！');
    document.getElementById('btn-save-product').innerText = '⏳ 儲存中...';
    
    // 保留原本的 status 狀態 (若有編輯已有項目)
    const existingStatus = currentEditProductIndex !== -1 ? (siteData.products[currentEditProductIndex]['狀態'] || '') : '';

    try {
      const res = await callAPI("saveProduct", {
        product: {
          title: title, image: document.getElementById('p-image').value.trim(),
          youtube: document.getElementById('p-youtube').value.trim(),
          originalPrice: document.getElementById('p-originalPrice').value,
          specialPrice: document.getElementById('p-specialPrice').value,
          category: document.getElementById('p-category').value.trim(),
          status: existingStatus
        }
      });
      alert(res.message); if (res.success) loadAllData();
    } catch(e) {} finally { document.getElementById('btn-save-product').innerText = '💾 儲存單品'; }
  }

  async function savePackage() {
    const title = document.getElementById('pkg-title').value.trim();
    if (!title) return alert('請填寫套裝名稱！');
    document.getElementById('btn-save-package').innerText = '⏳ 儲存中...';
    
    // 保留原本的 status 狀態
    const existingStatus = currentEditPackageIndex !== -1 ? (siteData.packages[currentEditPackageIndex]['狀態'] || '') : '';

    try {
      const res = await callAPI("savePackage", {
        package: {
          title: title, image: '', youtube: '',
          originalPrice: document.getElementById('pkg-originalPrice').value,
          specialPrice: document.getElementById('pkg-specialPrice').value,
          category: document.getElementById('pkg-category').value.trim(),
          status: existingStatus,
          packageDetail: document.getElementById('pkg-detail').value.trim()
        }
      });
      alert(res.message); if (res.success) loadAllData();
    } catch(e) {} finally { document.getElementById('btn-save-package').innerText = '💾 儲存套裝'; }
  }

  async function saveSettings() {
    document.getElementById('btn-save-set').innerText = '⏳ 儲存中...';
    try {
      const res = await callAPI("saveSettings", {
        settings: {
          '公告內容': document.getElementById('set-announcement').value.trim(),
          'LINE連結': document.getElementById('set-line').value.trim(),
          '滿額門檻': document.getElementById('set-threshold').value.trim(),
          '滿額贈品': document.getElementById('set-rewards').value.trim(),
          '主打商品': document.getElementById('set-featured').value.trim(),
          '訂單抬頭': document.getElementById('set-order-header').value.trim(),
          '訂單結尾': document.getElementById('set-order-footer').value.trim()
        }
      });
      alert(res.message); if (res.success) loadAllData();
    } catch(e) {} finally { document.getElementById('btn-save-set').innerText = '💾 儲存設定'; }
  }

  function closeUIModal() { 
    document.getElementById('ui-price-summary').style.display = 'none';
    document.getElementById('ui-modal').style.display = 'none'; 
  }

  /* 💡 開啟列表/排序/上下架三合一編輯器 */
  function openSortEditor(type) {
    currentUIType = 'sort_' + type;
    document.getElementById('ui-price-summary').style.display = 'none';
    const isProd = type === 'product';
    document.getElementById('ui-modal-title').innerText = isProd ? '🔃 單品列表/排序/上下架' : '🔃 套裝列表/排序/上下架';
    
    const list = isProd ? siteData.products : siteData.packages;
    let html = '';
    list.forEach((item, index) => {
      const title = item['商品名稱'];
      const cat = item['分類'] ? ` [${item['分類']}]` : '';
      const isOffShelf = (item['狀態'] || '').toString().trim().toUpperCase() === 'N';
      const checkedAttr = isOffShelf ? '' : 'checked';

      html += `
        <div class="drag-item" draggable="true" data-title="${title}">
          <span class="drag-handle" title="按住拖曳排序">☰</span>
          <div class="drag-title-clickable" onclick="selectAndEditFromModal('${type}', '${title}')">
            <span>${title}</span>
            <span style="color:#ffcc00; font-size:0.75rem;">${cat}</span>
          </div>
          <label class="drag-status-toggle">
            <input type="checkbox" class="status-check" ${checkedAttr} onchange="updateStatusLabel(this)">
            <span class="drag-status-label ${isOffShelf ? 'off' : 'on'}">${isOffShelf ? '下架' : '上架'}</span>
          </label>
        </div>`;
    });
    
    document.getElementById('ui-modal-list').innerHTML = html;
    document.getElementById('ui-modal-save-btn').innerText = '✅ 儲存狀態與全新排序';
    document.getElementById('ui-modal-save-btn').onclick = saveSortSelection;
    document.getElementById('ui-modal').style.display = 'flex';
    initDragEvents();
  }

  function updateStatusLabel(checkbox) {
    const label = checkbox.nextElementSibling;
    if (checkbox.checked) {
      label.innerText = '上架';
      label.className = 'drag-status-label on';
    } else {
      label.innerText = '下架';
      label.className = 'drag-status-label off';
    }
  }

  function selectAndEditFromModal(type, title) {
    closeUIModal();
    const isProd = type === 'product';
    const list = isProd ? siteData.products : siteData.packages;
    const idx = list.findIndex(p => p['商品名稱'] === title);
    if (idx !== -1) {
      const p = list[idx];
      if (isProd) {
        currentEditProductIndex = idx;
        document.getElementById('btn-del-product').style.display = 'inline-block';
        document.getElementById('p-title').value = p['商品名稱'] || '';
        document.getElementById('p-image').value = p['圖片檔名'] || '';
        document.getElementById('p-youtube').value = p['影片網址'] || '';
        document.getElementById('p-originalPrice').value = p['原價'] || '';
        document.getElementById('p-specialPrice').value = p['特價'] || '';
        document.getElementById('p-category').value = p['分類'] || '';
        const imgUrl = formatImageUrl(p['圖片檔名']);
        const prev = document.getElementById('p-image-preview');
        if (imgUrl) { prev.src = imgUrl; prev.style.display = 'block'; } else { prev.style.display = 'none'; }
        
        const formEl = document.getElementById('p-title');
        formEl.scrollIntoView({ behavior: 'smooth', block: 'center' });
        formEl.focus();
      } else {
        currentEditPackageIndex = idx;
        document.getElementById('btn-del-package').style.display = 'inline-block';
        const detailStr = p['包含內容'] || '';
        document.getElementById('pkg-title').value = p['商品名稱'] || '';
        document.getElementById('pkg-detail').value = detailStr;
        const calcPrice = calculateDetailTotalSum(detailStr);
        document.getElementById('pkg-originalPrice').value = p['原價'] ? p['原價'] : (calcPrice > 0 ? calcPrice : '');
        document.getElementById('pkg-specialPrice').value = p['特價'] || '';
        document.getElementById('pkg-category').value = p['分類'] || '超值套裝';
        
        const formEl = document.getElementById('pkg-title');
        formEl.scrollIntoView({ behavior: 'smooth', block: 'center' });
        formEl.focus();
      }
    }
  }

  function initDragEvents() {
    const list = document.getElementById('ui-modal-list');
    let draggedItem = null;

    list.addEventListener('dragstart', (e) => {
      draggedItem = e.target.closest('.drag-item');
      if (draggedItem) draggedItem.classList.add('dragging');
    });

    list.addEventListener('dragend', (e) => {
      if (draggedItem) draggedItem.classList.remove('dragging');
      draggedItem = null;
    });

    list.addEventListener('dragover', (e) => {
      e.preventDefault();
      const afterElement = getDragAfterElement(list, e.clientY);
      if (draggedItem) {
        if (afterElement == null) {
          list.appendChild(draggedItem);
        } else {
          list.insertBefore(draggedItem, afterElement);
        }
      }
    });
  }

  function getDragAfterElement(container, y) {
    const draggableElements = [...container.querySelectorAll('.drag-item:not(.dragging)')];
    return draggableElements.reduce((closest, child) => {
      const box = child.getBoundingClientRect();
      const offset = y - box.top - box.height / 2;
      if (offset < 0 && offset > closest.offset) {
        return { offset: offset, element: child };
      } else {
        return closest;
      }
    }, { offset: Number.NEGATIVE_INFINITY }).element;
  }

  async function saveSortSelection() {
    const itemEls = Array.from(document.getElementById('ui-modal-list').querySelectorAll('.drag-item'));
    const items = itemEls.map(el => {
      const title = el.getAttribute('data-title');
      const isChecked = el.querySelector('.status-check').checked;
      return {
        title: title,
        status: isChecked ? "" : "N"
      };
    });

    const type = currentUIType.replace('sort_', '');
    document.getElementById('ui-modal-save-btn').innerText = '⏳ 正在套用新狀態與排序...';

    try {
      const res = await callAPI("reorderItems", { type: type, items: items });
      alert(res.message);
      if (res.success) {
        closeUIModal();
        await loadAllData();
      }
    } catch(e) { alert("儲存失敗"); }
    finally {
      document.getElementById('ui-modal-save-btn').innerText = '✅ 儲存狀態與全新排序';
    }
  }

  function parseCurrentStr(str, isPoints = false) {
    const dict = {};
    if (!str) return dict;
    str.split(/[,，、]/).forEach(s => {
      const parts = s.split('*');
      if (parts.length === 2) {
        dict[parts[0].trim()] = isPoints ? parseFloat(parts[1]) : parseInt(parts[1]);
      } else if (s.trim()) {
        dict[s.trim()] = isPoints ? 0 : 1;
      }
    });
    return dict;
  }

  function updateModalLiveTotal() {
    if (currentUIType !== 'package') return;
    let liveSum = 0;
    siteData.products.forEach(p => {
      const title = p['商品名稱'];
      const el = document.getElementById(`ui-val-${title}`);
      if (el) {
        const qty = parseInt(el.value) || 0;
        const unitPrice = parseInt(p['原價']) || parseInt(p['特價']) || 0;
        liveSum += qty * unitPrice;
      }
    });
    document.getElementById('ui-total-val').innerText = `NT$${liveSum}`;
  }

  function modifyUIValue(title, delta, isPoints) {
    const input = document.getElementById(`ui-val-${title}`);
    if (isPoints) {
      let val = parseFloat(input.value) || 0;
      val = Math.max(0, val + delta);
      input.value = val === 0 ? '' : val;
    } else {
      let val = parseInt(input.value) || 0;
      val = Math.max(0, val + delta);
      input.value = val;
    }
    updateModalLiveTotal();
  }

  function openPackageEditor() {
    currentUIType = 'package';
    document.getElementById('ui-modal-title').innerText = '📦 編輯套裝內容';
    document.getElementById('ui-price-summary').style.display = 'block';
    document.getElementById('ui-modal-save-btn').innerText = '✅ 確認儲存';
    document.getElementById('ui-modal-save-btn').onclick = saveUISelection;
    const currentDict = parseCurrentStr(document.getElementById('pkg-detail').value);
    
    let html = '';
    siteData.products.forEach(p => {
      if(p['狀態'] === 'N') return;
      const title = p['商品名稱'];
      const unitPrice = parseInt(p['原價']) || parseInt(p['特價']) || 0;
      const qty = currentDict[title] || 0;
      html += `
        <div class="ui-item">
          <div class="ui-item-title">${title} <span style="font-size:0.75rem; color:#aaa;">(NT$${unitPrice})</span></div>
          <div class="ui-controls">
            <button class="qty-btn" onclick="modifyUIValue('${title}', -1, false)">-</button>
            <input type="number" class="qty-input" id="ui-val-${title}" value="${qty}" min="0" oninput="updateModalLiveTotal()">
            <button class="qty-btn" onclick="modifyUIValue('${title}', 1, false)">+</button>
          </div>
        </div>`;
    });
    document.getElementById('ui-modal-list').innerHTML = html;
    updateModalLiveTotal();
    document.getElementById('ui-modal').style.display = 'flex';
  }

  function openRewardEditor() {
    currentUIType = 'reward';
    document.getElementById('ui-modal-title').innerText = '🎁 編輯滿額贈品與點數';
    document.getElementById('ui-price-summary').style.display = 'none';
    document.getElementById('ui-modal-save-btn').innerText = '✅ 確認儲存';
    document.getElementById('ui-modal-save-btn').onclick = saveUISelection;
    const currentDict = parseCurrentStr(document.getElementById('set-rewards').value, true);
    
    let html = '';
    siteData.products.forEach(p => {
      if(p['狀態'] === 'N') return;
      const title = p['商品名稱'];
      const pts = currentDict[title] !== undefined ? currentDict[title] : '';
      html += `
        <div class="ui-item">
          <div class="ui-item-title">${title}</div>
          <div class="ui-controls">
            <span style="font-size:0.8rem; color:#aaa;">消耗</span>
            <input type="number" step="0.1" class="pts-input" id="ui-val-${title}" value="${pts}" placeholder="點數">
            <span style="font-size:0.8rem; color:#aaa;">點</span>
          </div>
        </div>`;
    });
    document.getElementById('ui-modal-list').innerHTML = html;
    document.getElementById('ui-modal').style.display = 'flex';
  }

  function openFeaturedEditor() {
    currentUIType = 'featured';
    document.getElementById('ui-modal-title').innerText = '🔥 勾選主打推播商品';
    document.getElementById('ui-price-summary').style.display = 'none';
    document.getElementById('ui-modal-save-btn').innerText = '✅ 確認儲存';
    document.getElementById('ui-modal-save-btn').onclick = saveUISelection;
    const currentDict = parseCurrentStr(document.getElementById('set-featured').value);
    
    let html = '';
    const allItems = [...siteData.packages, ...siteData.products];
    allItems.forEach(p => {
      if(p['狀態'] === 'N') return;
      const title = p['商品名稱'] || p['套裝名稱'];
      const checked = currentDict[title] ? 'checked' : '';
      html += `
        <label class="ui-item" style="cursor:pointer;">
          <div class="ui-item-title">${title}</div>
          <input type="checkbox" id="ui-check-${title}" ${checked}>
        </label>`;
    });
    document.getElementById('ui-modal-list').innerHTML = html;
    document.getElementById('ui-modal').style.display = 'flex';
  }

  function saveUISelection() {
    let resultArr = [];
    if (currentUIType === 'package') {
      siteData.products.forEach(p => {
        const title = p['商品名稱']; const el = document.getElementById(`ui-val-${title}`);
        if(el && parseInt(el.value) > 0) resultArr.push(`${title}*${parseInt(el.value)}`);
      });
      const detailStr = resultArr.join(', ');
      document.getElementById('pkg-detail').value = detailStr;
      
      const calculatedSum = calculateDetailTotalSum(detailStr);
      document.getElementById('pkg-originalPrice').value = calculatedSum > 0 ? calculatedSum : '';
    } 
    else if (currentUIType === 'reward') {
      siteData.products.forEach(p => {
        const title = p['商品名稱']; const el = document.getElementById(`ui-val-${title}`);
        if(el && parseFloat(el.value) > 0) resultArr.push(`${title}*${parseFloat(el.value)}`);
      });
      document.getElementById('set-rewards').value = resultArr.join(', ');
    }
    else if (currentUIType === 'featured') {
      const allItems = [...siteData.packages, ...siteData.products];
      allItems.forEach(p => {
        const title = p['商品名稱'] || p['套裝名稱'];
        if(document.getElementById(`ui-check-${title}`)?.checked) resultArr.push(title);
      });
      document.getElementById('set-featured').value = resultArr.join(',');
    }
    closeUIModal();
  }

  checkSavedAuth();
</script>
